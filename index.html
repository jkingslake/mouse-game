<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pip and the Ghosts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A gentle tap-and-chase game for toddlers: help Pip the mouse shoo the giggly ghosts away.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pip">
<meta name="theme-color" content="#1f2460">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one full-bleed canvas stage (a moonlit meadow); a title card floats over it until the first tap. */
:root {
  --sky-top: #1f2460;
  --sky-mid: #3a3a86;
  --sky-low: #7d62a9;
  --hill-far: #3b736d;
  --hill-near: #285549;
  --grass: #4e946a;
  --moon: #fff1bf;
  --cheese: #ffc94a;
  --cheese-light: #ffe08a;
  --cheese-deep: #e79a22;
  --ghost: #fdfcff;
  --ghost-mint: #c4f2dd;
  --ghost-pink: #ffd3e4;
  --ghost-sky: #d0e2ff;
  --ghost-lemon: #fff0b0;
  --blush: #ff93b0;
  --fur: #b9aba6;
  --fur-light: #efe5df;
  --ear: #ffb3c4;
  --tail: #dba1ad;
  --ink: #2a2144;
  --star: #ffd95e;
  --cream: #fff7e6;
  --wood: #9a6847;
  --wood-dark: #64402c;
  --firefly: #eaff8f;
  --veil: rgba(18, 20, 60, 0.62);
  --shadow: rgba(10, 8, 30, 0.45);
  --zombie-skin: #a5d98b;
  --zombie-shade: #7fbd6c;
  --zombie-pants: #4a4777;
  --shirt-lilac: #a493f2;
  --shirt-sky: #6fb5ea;
  --shirt-orange: #f5a65b;
  --shirt-pink: #f08fbb;
  --shirt-teal: #56c4b0;
  --dust: #dcc9a6;
  --alien-lime: #9be36d;
  --alien-pink: #ff9ad5;
  --alien-sky: #7fd3ff;
  --alien-orange: #ffb45c;
  --alien-violet: #b79bff;
  --saucer: #cfcbe9;
  --saucer-dark: #8f88bf;
  --glass: rgba(205, 238, 255, 0.28);
  --dino-teal: #4fc9a8;
  --dino-orange: #ff9a52;
  --dino-purple: #a98bf5;
  --dino-blue: #5daeff;
  --dino-pink: #ff8fb3;
  --dino-belly: #ffeab8;
  --egg: #fff4dc;
  --chip: rgba(20, 18, 50, 0.6);
  --chip-line: rgba(255, 247, 230, 0.22);

  --font-display: "Grandstander", "Chalkboard SE", ui-rounded, "Comic Sans MS", system-ui, sans-serif;
  --font-body: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

* {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--sky-top);
  color: var(--cream);
}
body {
  position: fixed;
  inset: 0;
  touch-action: none;
  font-family: var(--font-body);
}

#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#safe-probe {
  position: fixed;
  visibility: hidden;
  pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

.title {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
  background: radial-gradient(ellipse 75% 70% at 50% 46%, transparent 25%, var(--veil) 100%);
  cursor: pointer;
  touch-action: manipulation;
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.title.is-leaving {
  opacity: 0;
  transform: scale(1.04);
  pointer-events: none;
}
.title__main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 4.5vmin, 44px);
  min-height: 0;
}
.title__name {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: var(--font-display);
  text-align: center;
  text-wrap: balance;
  line-height: 0.9;
}
.title__pip {
  font-size: clamp(84px, 21vmin, 220px);
  font-weight: 900;
  letter-spacing: -0.01em;
  color: var(--cheese);
  text-shadow: 0 0.05em 0 var(--cheese-deep), 0 0.12em 0.3em var(--shadow);
  transform: rotate(-4deg);
  animation: wobble 3.2s ease-in-out infinite;
}
.title__rest {
  font-size: clamp(28px, 6.2vmin, 66px);
  font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--cream);
  text-shadow: 0 0.07em 0 var(--ink), 0 0.1em 0.4em var(--shadow);
}

.play {
  width: clamp(112px, 22vmin, 190px);
  max-width: 100%;
  aspect-ratio: 1;
  flex: none;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  padding: 0;
  cursor: pointer;
  color: var(--ink);
  background:
    radial-gradient(circle at 24% 32%, var(--cheese-deep) 0 6%, transparent 6.6%),
    radial-gradient(circle at 76% 68%, var(--cheese-deep) 0 8%, transparent 8.6%),
    radial-gradient(circle at 70% 22%, var(--cheese-deep) 0 4.5%, transparent 5%),
    radial-gradient(circle at 32% 79%, var(--cheese-deep) 0 4%, transparent 4.6%),
    var(--cheese);
  box-shadow: inset 0 -0.6em 0 rgba(0, 0, 0, 0.08), 0 0.5em 0 var(--cheese-deep), 0 1.2em 2.2em var(--shadow);
  font-size: clamp(12px, 2vmin, 18px);
  animation: pulse 1.5s ease-in-out infinite;
}
.play svg { width: 46%; height: 46%; }
.play:focus-visible {
  outline: 5px solid var(--cream);
  outline-offset: 8px;
}

.title__foot {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(10px, 2vmin, 16px);
}
.chooser {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 5px 5px 5px 16px;
  border-radius: 999px;
  background: var(--chip);
  border: 2px solid var(--chip-line);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: clamp(15px, 2vmin, 18px);
  font-weight: 600;
  cursor: default;
  touch-action: manipulation;
}
.chooser__pick {
  position: relative;
  display: inline-flex;
}
.chooser select {
  -webkit-appearance: none;
  appearance: none;
  margin: 0;
  min-height: 40px;
  padding: 6px 36px 6px 16px;
  border: 0;
  border-radius: 999px;
  background: var(--cheese);
  color: var(--ink);
  box-shadow: 0 3px 0 var(--cheese-deep);
  font-family: var(--font-display);
  font-size: 1.1em;
  font-weight: 700;
  cursor: pointer;
}
.chooser select:focus-visible {
  outline: 3px solid var(--cream);
  outline-offset: 3px;
}
.chooser__chevron {
  position: absolute;
  right: 14px;
  top: 50%;
  width: 12px;
  height: 8px;
  margin-top: -4px;
  color: var(--ink);
  pointer-events: none;
}
.title__notes {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 36em;
  margin: 0;
  font-size: clamp(14px, 2.1vmin, 18px);
  line-height: 1.4;
  text-align: center;
  color: var(--cream);
  opacity: 0.85;
}
.title__notes p { margin: 0; }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.07); }
}
@keyframes wobble {
  0%, 100% { transform: rotate(-4deg); }
  50% { transform: rotate(-1deg) translateY(-0.03em); }
}
/* in-game corner controls: hold-to-go-home (top left) and the level badge (top right) */
.home {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: calc(env(safe-area-inset-left, 0px) + 12px);
  width: 52px;
  height: 52px;
  padding: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 2px solid var(--chip-line);
  background: var(--chip);
  color: var(--cream);
  cursor: pointer;
  touch-action: none;
}
.home:focus-visible {
  outline: 3px solid var(--cream);
  outline-offset: 3px;
}
.home__icon { width: 24px; height: 24px; }
.home__ring {
  position: absolute;
  inset: -2px;
  width: calc(100% + 4px);
  height: calc(100% + 4px);
  transform: rotate(-90deg);
  pointer-events: none;
}
.home__ring circle {
  fill: none;
  stroke: var(--cheese);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 145;
  stroke-dashoffset: 145;
}
.home-tip {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 24px);
  left: calc(env(safe-area-inset-left, 0px) + 74px);
  padding: 5px 12px;
  border-radius: 10px;
  background: var(--chip);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  pointer-events: none;
}
.level {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: calc(env(safe-area-inset-right, 0px) + 12px);
  display: flex;
  align-items: baseline;
  gap: 7px;
  padding: 4px 16px 6px;
  border-radius: 999px;
  border: 2px solid var(--chip-line);
  background: var(--chip);
  color: var(--cream);
  font-family: var(--font-display);
  font-size: clamp(16px, 2.4vmin, 22px);
  font-weight: 700;
  letter-spacing: 0.02em;
  pointer-events: none;
}
.level__num {
  display: inline-block;
  color: var(--cheese);
  font-size: 1.4em;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.level.bump .level__num { animation: bump 0.6s ease; }
.banner {
  position: fixed;
  left: 0;
  right: 0;
  top: 32%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(56px, 14vmin, 150px);
  font-weight: 900;
  line-height: 1;
  color: var(--cheese);
  text-shadow: 0 0.05em 0 var(--cheese-deep), 0 0.12em 0.3em var(--shadow);
  opacity: 0;
  pointer-events: none;
}
.banner.show { animation: banner 1.9s ease forwards; }
@keyframes bump {
  0% { transform: scale(1); }
  40% { transform: scale(1.5) rotate(-6deg); }
  100% { transform: scale(1); }
}
@keyframes banner {
  0% { opacity: 0; transform: scale(0.4) rotate(-6deg); }
  18% { opacity: 1; transform: scale(1.12) rotate(-3deg); }
  30% { transform: scale(1) rotate(-3deg); }
  80% { opacity: 1; transform: scale(1) rotate(-3deg); }
  100% { opacity: 0; transform: scale(1.05) translateY(-0.3em) rotate(-3deg); }
}
@media (prefers-reduced-motion: reduce) {
  .level.bump .level__num { animation: none; }
  .banner.show { animation: banner-fade 1.9s linear forwards; }
}
@keyframes banner-fade {
  0%, 100% { opacity: 0; }
  15%, 80% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .play, .title__pip { animation: none; }
  .title { transition: opacity 0.2s linear; }
}
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="Pip the mouse in a moonlit meadow, with friendly ghosts floating in the sky"></canvas>

<div id="title" class="title">
  <div class="title__main">
    <h1 class="title__name"><span class="title__pip">Pip</span><span class="title__rest">and the Ghosts</span></h1>
    <button id="play" class="play" type="button" aria-label="Play">
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M38 25 L76 50 L38 75 Z" fill="currentColor" stroke="currentColor" stroke-width="12" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="title__foot">
    <label class="chooser" id="chooser">
      <span>Pip chases</span>
      <span class="chooser__pick">
        <select id="kind">
          <option value="ghost">Ghosts</option>
          <option value="zombie">Zombies</option>
          <option value="alien">Aliens</option>
          <option value="dino">Dinosaurs</option>
        </select>
        <svg class="chooser__chevron" viewBox="0 0 12 8" aria-hidden="true"><path d="M1.5 1.5 6 6 10.5 1.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </label>
    <div class="title__notes">
      <p>For grown-ups: turn the sound up, then tap or drag to steer Pip. Shoo away five <span id="kind-word">ghosts</span> to earn a cheese party.</p>
      <p data-repo-only>On iPad, tap Share and then Add to Home Screen for full-screen play.</p>
    </div>
  </div>
</div>

<button id="home" class="home" type="button" aria-label="Back to the start screen (press and hold)" hidden>
  <svg class="home__ring" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23"/></svg>
  <svg class="home__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20a1 1 0 0 1-1 1h-4.6v-5.6H9.1V21H4.5a1 1 0 0 1-1-1z" fill="currentColor"/></svg>
</button>
<div id="home-tip" class="home-tip" hidden>Hold to go back</div>
<div id="level" class="level" hidden aria-live="polite"><span>Level</span><span id="level-num" class="level__num">1</span></div>
<div id="level-banner" class="banner" hidden aria-hidden="true">Level 1</div>

<div id="safe-probe" aria-hidden="true"></div>

<script>
'use strict';

/* ------------------------------------------------------------------
   Pip and the Ghosts — a no-lose chase game for very small hands.
   Tap anywhere: Pip scurries there. Touch a ghost: it giggles away
   and leaves a star. Five stars: fireworks and a cheese to munch.
------------------------------------------------------------------- */

const TAU = Math.PI * 2;
const STARS_PER_ROUND = 5;

/* ---------- palette (read from the CSS tokens) ---------- */
const rootStyle = getComputedStyle(document.documentElement);
const C = {};
for (const name of [
  'sky-top', 'sky-mid', 'sky-low', 'hill-far', 'hill-near', 'grass', 'moon',
  'cheese', 'cheese-light', 'cheese-deep', 'ghost', 'ghost-mint', 'ghost-pink',
  'ghost-sky', 'ghost-lemon', 'blush', 'fur', 'fur-light', 'ear', 'tail', 'ink',
  'star', 'cream', 'wood', 'wood-dark', 'firefly', 'zombie-skin', 'zombie-shade', 'zombie-pants',
  'shirt-lilac', 'shirt-sky', 'shirt-orange', 'shirt-pink', 'shirt-teal', 'dust',
  'alien-lime', 'alien-pink', 'alien-sky', 'alien-orange', 'alien-violet', 'saucer', 'saucer-dark',
  'dino-teal', 'dino-orange', 'dino-purple', 'dino-blue', 'dino-pink', 'dino-belly', 'egg'
]) {
  C[name.replace(/-([a-z])/g, (_, ch) => ch.toUpperCase())] = rootStyle.getPropertyValue('--' + name).trim();
}
const GHOST_TINTS = [C.ghost, C.ghostMint, C.ghostPink, C.ghostSky, C.ghostLemon];
const SHIRTS = [C.shirtLilac, C.shirtSky, C.shirtOrange, C.shirtPink, C.shirtTeal];
const ALIEN_SKINS = [C.alienLime, C.alienPink, C.alienSky, C.alienOrange, C.alienViolet];
const DINO_SKINS = [C.dinoTeal, C.dinoOrange, C.dinoPurple, C.dinoBlue, C.dinoPink];
const GLASS = rootStyle.getPropertyValue('--glass').trim();
const PARTY_COLORS = [C.cheese, C.blush, C.ghostMint, C.ghostSky, C.star, C.cream];

/* ---------- small helpers ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

function rgba(hex, a) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  const n = parseInt(h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function turnToward(a, b, step) {
  let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + clamp(d, -step, step);
}
function ellipse(g, x, y, rx, ry, rot) {
  g.beginPath();
  g.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot || 0, 0, TAU);
}
function starPath(g, x, y, R, r, rot) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5;
    const rad = i % 2 ? r : R;
    if (i === 0) g.moveTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    else g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  g.closePath();
}
function rrect(g, x, y, w, h, rad) {
  g.beginPath();
  g.moveTo(x + rad, y);
  g.arcTo(x + w, y, x + w, y + h, rad);
  g.arcTo(x + w, y + h, x, y + h, rad);
  g.arcTo(x, y + h, x, y, rad);
  g.arcTo(x, y, x + w, y, rad);
  g.closePath();
}
function archPath(g, x, top, w, bottom) {
  g.beginPath();
  g.moveTo(x - w / 2, bottom);
  g.lineTo(x - w / 2, top + w / 2);
  g.arc(x, top + w / 2, w / 2, Math.PI, 0);
  g.lineTo(x + w / 2, bottom);
  g.closePath();
}

/* ---------- sound: everything is synthesized, nothing to download ---------- */
const NOTE = { G5: 783.99, C6: 1046.5, D6: 1174.66, E6: 1318.51, G6: 1567.98, A6: 1760, C7: 2093 };
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

// A quarter second of silence as a WAV file, built in code so there is nothing to download.
function silentWavUrl() {
  const n = 2000, rate = 8000;
  const buf = new Uint8Array(44 + n);
  const dv = new DataView(buf.buffer);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) buf[o + i] = s.charCodeAt(i); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
  str(36, 'data'); dv.setUint32(40, n, true);
  buf.fill(128, 44);
  let bin = '';
  for (let i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
  return 'data:audio/wav;base64,' + btoa(bin);
}

const Sound = {
  ctx: null, master: null, noiseBuf: null, primed: false, media: null, mediaTries: 0,
  build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    // a gentle limiter so overlapping sounds can be loud without distorting
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -10;
    comp.knee.value = 8;
    comp.ratio.value = 6;
    comp.attack.value = 0.003;
    comp.release.value = 0.2;
    this.master = this.ctx.createGain();
    this.master.gain.value = 1.6;
    this.master.connect(comp);
    comp.connect(this.ctx.destination);
    const len = Math.floor(this.ctx.sampleRate * 1.5);
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    this.primed = false;
  },
  // Called from every tap. iPad only lets a page start sound from inside a tap, and keeps
  // web sound muted in Silent Mode unless the page asks to play like a video does.
  unlock() {
    try {
      if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback';
    } catch (e) { /* older iPadOS: handled by the silent <audio> fallback below */ }
    try {
      if (!this.ctx || this.ctx.state === 'closed') this.build();
      if (!this.ctx) return;
      if (this.ctx.state !== 'running') {
        const p = this.ctx.resume();
        if (p && p.catch) p.catch(() => {});
        this.primed = false;
      }
      if (!this.primed) {
        // playing a silent blip inside the tap is what actually wakes iOS audio
        const blip = this.ctx.createBufferSource();
        blip.buffer = this.ctx.createBuffer(1, 1, this.ctx.sampleRate);
        blip.connect(this.ctx.destination);
        blip.start(0);
        this.primed = this.ctx.state === 'running';
      }
      this.silentMediaFallback();
    } catch (e) { /* no sound is better than a crash */ }
  },
  // iPadOS before 17 has no audioSession setting. A looping silent <audio> element moves the
  // page into "playback" audio, which Silent Mode does not mute.
  silentMediaFallback() {
    if (navigator.audioSession || !IS_IOS) return;
    if (this.media) {
      if (this.media.paused && document.visibilityState === 'visible') this.media.play().catch(() => {});
      return;
    }
    if (this.mediaTries >= 3) return;
    this.mediaTries++;
    const a = document.createElement('audio');
    a.setAttribute('playsinline', '');
    a.setAttribute('x-webkit-airplay', 'deny');
    a.loop = true;
    a.preload = 'auto';
    a.src = silentWavUrl();
    this.media = a;
    const p = a.play();
    if (p && p.catch) p.catch(() => { if (this.media === a) this.media = null; });
  },
  env(gain, t0, vol, attack, dur) {
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  },
  tone(o) {
    const c = this.ctx; if (!c) return;
    const t0 = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator();
    osc.type = o.type || 'sine';
    if (o.path) {
      osc.frequency.setValueAtTime(o.path[0][1], t0);
      for (let i = 1; i < o.path.length; i++) osc.frequency.linearRampToValueAtTime(o.path[i][1], t0 + o.path[i][0]);
    } else {
      osc.frequency.setValueAtTime(o.f0, t0);
      if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t0 + o.dur);
    }
    const gain = c.createGain();
    this.env(gain, t0, o.vol || 0.2, o.attack || 0.008, o.dur);
    if (o.vib) {
      const lfo = c.createOscillator(), depth = c.createGain();
      lfo.frequency.value = o.vib.rate; depth.gain.value = o.vib.depth;
      lfo.connect(depth); depth.connect(osc.frequency);
      lfo.start(t0); lfo.stop(t0 + o.dur + 0.05);
    }
    osc.connect(gain); gain.connect(this.master);
    osc.start(t0); osc.stop(t0 + o.dur + 0.05);
  },
  noise(o) {
    const c = this.ctx; if (!c || !this.noiseBuf) return;
    const t0 = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource();
    src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = o.filter || 'lowpass';
    f.frequency.setValueAtTime(o.f0, t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + o.dur);
    f.Q.value = o.q || 1;
    const gain = c.createGain();
    this.env(gain, t0, o.vol || 0.2, o.attack || 0.005, o.dur);
    src.connect(f); f.connect(gain); gain.connect(this.master);
    src.start(t0, Math.random() * 0.8); src.stop(t0 + o.dur + 0.05);
  },
  squeak(delay = 0) {
    const p = rnd(0.9, 1.15);
    this.tone({ type: 'triangle', f0: 1400 * p, f1: 2400 * p, dur: 0.1, vol: 0.22, delay });
    this.tone({ type: 'sine', f0: 1800 * p, f1: 2900 * p, dur: 0.09, vol: 0.17, delay: delay + 0.1 });
  },
  poof() {
    this.noise({ filter: 'lowpass', f0: 2600, f1: 240, dur: 0.42, vol: 0.45, q: 0.7 });
    this.tone({ type: 'sine', f0: 420, f1: 110, dur: 0.25, vol: 0.18 });
  },
  giggle() {
    [0, 0.11, 0.22, 0.33].forEach((d, i) => this.tone({ type: 'sine', f0: 1050 - i * 70, f1: 880 - i * 70, dur: 0.09, vol: 0.11, delay: d, vib: { rate: 30, depth: 40 } }));
    this.noise({ filter: 'bandpass', f0: 500, f1: 1800, q: 1.2, dur: 0.7, vol: 0.08 });
  },
  ding(i) {
    const f = [NOTE.C6, NOTE.D6, NOTE.E6, NOTE.G6, NOTE.C7][i % 5];
    this.tone({ type: 'sine', f0: f, dur: 0.9, vol: 0.22, attack: 0.005 });
    this.tone({ type: 'sine', f0: f * 2, dur: 0.4, vol: 0.06 });
    this.tone({ type: 'triangle', f0: f * 3, dur: 0.18, vol: 0.025 });
  },
  // a goofy, sleepy "uhh-uh" with a scuff of dirt: a zombie popping up
  groan() {
    this.tone({ type: 'triangle', path: [[0, 210], [0.25, 255], [0.6, 170]], dur: 0.65, vol: 0.18, attack: 0.08, vib: { rate: 7, depth: 10 } });
    this.tone({ type: 'sine', path: [[0, 105], [0.25, 128], [0.6, 85]], dur: 0.65, vol: 0.1, attack: 0.08 });
    this.noise({ filter: 'lowpass', f0: 900, f1: 200, dur: 0.35, vol: 0.12 });
  },
  // "ho-ho-ho!" and pitter-patter feet: a zombie running off
  chuckle() {
    [0, 0.12, 0.24, 0.36].forEach((d, i) => this.tone({ type: 'triangle', f0: 520 - i * 35, f1: 430 - i * 35, dur: 0.1, vol: 0.16, delay: d, vib: { rate: 25, depth: 25 } }));
    [0, 0.13, 0.26, 0.39].forEach(d => this.noise({ filter: 'bandpass', f0: 650, q: 1.2, dur: 0.07, vol: 0.1, delay: d + 0.45 }));
  },
  // "bwoo-ip!": a little saucer beaming in (limited so a crowd of aliens doesn't get noisy)
  beamIn() {
    if (this.ctx && this.ctx.currentTime - (this.lastBeam || -1) < 0.5) return;
    if (this.ctx) this.lastBeam = this.ctx.currentTime;
    this.tone({ type: 'sine', path: [[0, 300], [0.12, 1250], [0.22, 950]], dur: 0.26, vol: 0.12, vib: { rate: 22, depth: 30 } });
  },
  // "bee-boo bee-boo!" as a saucer zooms off home
  beeBoo() {
    [0, 0.1, 0.2, 0.3].forEach((d, i) => this.tone({ type: 'triangle', f0: i % 2 ? 700 + i * 40 : 950 + i * 40, dur: 0.09, vol: 0.13, delay: d }));
    this.tone({ type: 'sine', f0: 500, f1: 1800, dur: 0.6, vol: 0.06, delay: 0.35 });
  },
  levelUp() {
    ['G5', 'C6', 'E6', 'G6', 'C7'].forEach((k, i) => this.tone({ type: 'triangle', f0: NOTE[k], dur: 0.3, vol: 0.13, delay: i * 0.07 }));
    this.tone({ type: 'sine', f0: NOTE.C7, dur: 0.9, vol: 0.06, delay: 0.35 });
  },
  // dinosaurs: an egg going "tok-tok", a crack, and a tiny "rawr!"
  eggTok() {
    [0, 0.14].forEach(d => this.tone({ type: 'sine', f0: 950, f1: 700, dur: 0.06, vol: 0.12, delay: d }));
  },
  hatch() {
    [0, 0.06, 0.13].forEach(d => this.noise({ filter: 'bandpass', f0: 2600, q: 2, dur: 0.05, vol: 0.3, delay: d }));
    this.rawr(0.18);
  },
  rawr(delay = 0) {
    this.tone({ type: 'triangle', path: [[0, 260], [0.12, 540], [0.4, 300]], dur: 0.45, vol: 0.17, delay, vib: { rate: 35, depth: 30 } });
    this.noise({ filter: 'bandpass', f0: 900, q: 1.5, dur: 0.35, vol: 0.06, delay });
  },
  stompOff() {
    this.rawr();
    this.rawr(0.32);
    [0.3, 0.5, 0.7, 0.9].forEach(d => this.tone({ type: 'sine', f0: 110, f1: 55, dur: 0.12, vol: 0.22, delay: d }));
  },
  // the moon's funny noises: slide whistle, boing, raspberry, big yawn, wah-wah-waaah
  moonNoise(v) {
    if (v === 0) {
      this.tone({ type: 'sine', path: [[0, 500], [0.35, 1600], [0.75, 420]], dur: 0.8, vol: 0.17, vib: { rate: 6, depth: 12 } });
    } else if (v === 1) {
      this.tone({ type: 'sine', path: [[0, 180], [0.08, 620], [0.8, 220]], dur: 0.85, vol: 0.18, vib: { rate: 11, depth: 90 } });
    } else if (v === 2) {
      this.tone({ type: 'sawtooth', f0: 125, f1: 85, dur: 0.7, vol: 0.06, vib: { rate: 32, depth: 30 } });
      this.noise({ filter: 'bandpass', f0: 420, q: 2.5, dur: 0.7, vol: 0.16 });
    } else if (v === 3) {
      this.tone({ type: 'triangle', path: [[0, 300], [0.35, 540], [1.05, 230]], dur: 1.1, vol: 0.15, attack: 0.15, vib: { rate: 5, depth: 18 } });
    } else {
      [[0, 392], [0.32, 370], [0.64, 349]].forEach(([d, f]) => this.tone({ type: 'triangle', f0: f, dur: 0.3, vol: 0.15, delay: d, vib: { rate: 5, depth: 6 } }));
      this.tone({ type: 'triangle', f0: 330, f1: 300, dur: 0.9, vol: 0.15, delay: 0.96, vib: { rate: 6, depth: 14 } });
    }
  },
  // the front door: creak, a rummage inside, ta-da, thud
  creak(len = 0.5) {
    this.tone({ type: 'sawtooth', path: [[0, 160], [len * 0.5, 240], [len, 190]], dur: len, vol: 0.05, attack: 0.05, vib: { rate: 38, depth: 25 } });
    this.noise({ filter: 'bandpass', f0: 1200, f1: 800, q: 3, dur: len, vol: 0.06 });
  },
  rummage() {
    [520, 390, 660, 300].forEach((f, i) => this.tone({ type: 'triangle', f0: f, f1: f * 0.82, dur: 0.08, vol: 0.13, delay: i * 0.12 }));
    this.noise({ filter: 'bandpass', f0: 900, q: 1, dur: 0.45, vol: 0.06 });
  },
  tada(silly) {
    if (silly) {
      this.tone({ type: 'sine', path: [[0, 200], [0.1, 700], [0.35, 260]], dur: 0.38, vol: 0.16, vib: { rate: 14, depth: 70 } });
      this.tone({ type: 'square', f0: 330, f1: 300, dur: 0.18, vol: 0.06, delay: 0.42 });
      this.tone({ type: 'square', f0: 330, f1: 290, dur: 0.25, vol: 0.06, delay: 0.64 });
    } else {
      this.tone({ type: 'triangle', f0: NOTE.C6, dur: 0.3, vol: 0.14 });
      this.tone({ type: 'triangle', f0: NOTE.G6, dur: 0.45, vol: 0.14, delay: 0.1 });
      this.tone({ type: 'sine', f0: NOTE.C7, dur: 0.6, vol: 0.07, delay: 0.1 });
    }
  },
  thud() {
    this.tone({ type: 'sine', f0: 140, f1: 60, dur: 0.15, vol: 0.25 });
    this.noise({ filter: 'lowpass', f0: 500, dur: 0.1, vol: 0.12 });
  },
  arrive(kind) {
    if (kind === 'zombie') this.groan();
    else if (kind === 'alien') this.beamIn();
    else if (kind === 'dino') this.rawr();
    else this.wooo();
  },
  wooo() {
    this.tone({ type: 'sine', path: [[0, 330], [0.35, 520], [0.9, 360]], dur: 0.95, vol: 0.11, attack: 0.25, vib: { rate: 5.5, depth: 14 } });
  },
  whoosh() {
    this.noise({ filter: 'bandpass', f0: 300, f1: 2400, q: 0.9, dur: 0.55, vol: 0.1 });
    this.tone({ type: 'sine', f0: 500, f1: 1500, dur: 0.5, vol: 0.04 });
  },
  pop() {
    const p = rnd(0.8, 1.25);
    this.noise({ filter: 'bandpass', f0: 1400 * p, q: 0.8, dur: 0.18, vol: 0.22 });
    this.tone({ type: 'sine', f0: 700 * p, f1: 180 * p, dur: 0.15, vol: 0.08 });
  },
  fanfare() {
    [[0, 'G5', 0.14], [0.15, 'C6', 0.14], [0.3, 'E6', 0.14], [0.45, 'G6', 0.32], [0.82, 'E6', 0.14], [0.97, 'G6', 0.7]].forEach(([d, n, len]) => {
      this.tone({ type: 'triangle', f0: NOTE[n], dur: len + 0.1, vol: 0.14, delay: d });
      this.tone({ type: 'sine', f0: NOTE[n] / 2, dur: len + 0.1, vol: 0.06, delay: d });
    });
    this.tone({ type: 'sine', f0: NOTE.C7, dur: 0.8, vol: 0.05, delay: 0.97 });
  },
  falling() {
    this.tone({ type: 'sine', f0: 1500, f1: 480, dur: 0.9, vol: 0.05 });
  },
  boing(n) {
    this.tone({ type: 'sine', path: [[0, 160], [0.08, 420], [0.3, 240]], dur: 0.32, vol: 0.2 / n, vib: { rate: 18, depth: 25 } });
  },
  nom() {
    [0, 0.16].forEach(d => {
      this.noise({ filter: 'bandpass', f0: 700, q: 1.5, dur: 0.09, vol: 0.35, delay: d });
      this.tone({ type: 'sine', f0: 240, f1: 170, dur: 0.11, vol: 0.2, delay: d });
    });
  },
  yum() {
    ['C6', 'E6', 'G6', 'C7'].forEach((k, i) => this.tone({ type: 'triangle', f0: NOTE[k], dur: 0.35, vol: 0.12, delay: i * 0.08 }));
  }
};

/* ---------- stage ---------- */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const bg = document.createElement('canvas');
const bctx = bg.getContext('2d');
const probe = document.getElementById('safe-probe');
const titleEl = document.getElementById('title');
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

let W = 0, H = 0, DPR = 1, U = 1;            // U = 1% of the short side; everything is sized in U
const inset = { top: 0, right: 0, bottom: 0, left: 0 };
const world = { doorX: 0, doorTop: 0, doorBot: 0, doorW: 0, homeX: 0, homeY: 0, moonX: 0, moonY: 0, moonR: 0 };
let skyStars = [], fireflies = [];

const state = { kind: 'ghost', mode: 'title', time: 0, idle: 0, round: 0, caught: 0, filled: 0, spawnTimer: 0, lastSqueak: -1, hintWoo: 3 };
const mouse = { x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, face: 1, faceK: 1, phase: 0, run: 0, hopT: 1, blink: 0, blinkT: 2.5, munch: 0, lock: null, lockCheese: false, placed: false, inK: 1, hat: null, hatSilly: false };
// the moon wakes up when Pip visits; the front door opens when Pip goes to it
const moon = { awake: 0, timer: 0, variant: -1, armed: true, wobble: 0 };
const door = { open: 0, phase: 'idle', t: 0, armed: true, busy: false };
let ghosts = [], particles = [], flyers = [], timers = [];
const slots = Array.from({ length: STARS_PER_ROUND }, () => ({ filled: false, pop: 0 }));
let party = null;
const pointer = { id: null, down: false };

const mouseS = () => 6.2 * U;

function farHillY(x) {
  return H * 0.70 + Math.sin(x / W * TAU * 1.1 + 0.6) * 5 * U + Math.sin(x / W * TAU * 2.7 + 2.1) * 1.8 * U;
}
function nearHillY(x) {
  return H * 0.81 + Math.sin(x / W * TAU * 0.8 + 2.4) * 3.5 * U + Math.sin(x / W * TAU * 2.2 + 0.3) * 1.2 * U;
}

function readInsets() {
  const s = getComputedStyle(probe);
  inset.top = parseFloat(s.paddingTop) || 0;
  inset.right = parseFloat(s.paddingRight) || 0;
  inset.bottom = parseFloat(s.paddingBottom) || 0;
  inset.left = parseFloat(s.paddingLeft) || 0;
}

function resize() {
  const oldW = W, oldH = H;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  U = Math.min(W, H) / 100;
  readInsets();

  if (oldW && oldH && (oldW !== W || oldH !== H)) {
    const sx = W / oldW, sy = H / oldH;
    for (const o of [mouse, ...ghosts]) { o.x *= sx; o.y *= sy; }
    mouse.tx *= sx; mouse.ty *= sy;
    if (party && party.cheese) { party.cheese.x *= sx; party.cheese.y *= sy; }
  }
  buildBackground();
  seedSky();
  if (!mouse.placed || state.mode === 'title') {
    mouse.x = mouse.tx = world.homeX;
    mouse.y = mouse.ty = world.homeY;
    mouse.placed = true;
  }
}

function buildBackground() {
  bg.width = canvas.width;
  bg.height = canvas.height;
  const g = bctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const rng = mulberry32(11);

  // sky
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, C.skyTop);
  sky.addColorStop(0.5, C.skyMid);
  sky.addColorStop(0.86, C.skyLow);
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  // the moon is drawn every frame (it can wake up); just remember where it sits
  world.moonR = 9 * U;
  world.moonX = W - 15 * U - inset.right;
  world.moonY = Math.max(H * 0.2, 22 * U) + inset.top * 0.5;

  // far hill
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, farHillY(x));
  g.lineTo(W, H); g.closePath();
  g.fillStyle = C.hillFar; g.fill();

  // near hill
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, nearHillY(x));
  g.lineTo(W, H); g.closePath();
  const hill = g.createLinearGradient(0, H * 0.76, 0, H);
  hill.addColorStop(0, C.grass);
  hill.addColorStop(1, C.hillNear);
  g.fillStyle = hill; g.fill();

  // Pip's front door, dug into the near hill (the frame lives here; the door itself is drawn
  // every frame so it can creak open)
  const dx = 13 * U + inset.left;
  const y0 = nearHillY(dx);
  const dw = 8 * U, dTop = y0 + 3 * U, dBot = dTop + 10 * U;
  world.doorX = dx; world.doorTop = dTop; world.doorBot = dBot; world.doorW = dw;
  g.fillStyle = C.woodDark;
  archPath(g, dx, dTop - 0.9 * U, dw + 1.8 * U, dBot); g.fill();
  // round window with a warm light inside
  const wx = dx + dw / 2 + 4.6 * U, wy = dTop + 2.6 * U, wr = 2 * U;
  const glow = g.createRadialGradient(wx, wy, wr * 0.5, wx, wy, wr * 3);
  glow.addColorStop(0, rgba(C.cheese, 0.45)); glow.addColorStop(1, rgba(C.cheese, 0));
  g.fillStyle = glow; g.fillRect(wx - wr * 3, wy - wr * 3, wr * 6, wr * 6);
  g.fillStyle = C.cheese; ellipse(g, wx, wy, wr, wr); g.fill();
  g.strokeStyle = C.woodDark; g.lineWidth = 0.45 * U;
  g.beginPath(); g.moveTo(wx - wr, wy); g.lineTo(wx + wr, wy); g.moveTo(wx, wy - wr); g.lineTo(wx, wy + wr); g.stroke();
  g.lineWidth = 0.7 * U; ellipse(g, wx, wy, wr, wr); g.stroke();

  // grass tufts
  g.fillStyle = C.hillNear;
  const tufts = Math.round(W / (5 * U));
  for (let i = 0; i < tufts; i++) {
    const x = rng() * W, y = nearHillY(x) + 1 * U + rng() * 6 * U;
    if (Math.abs(x - dx) < dw && y < dBot + U) continue;
    for (const a of [-1, 0, 1]) {
      const bx = x + a * 0.55 * U, h = (a === 0 ? 2.3 : 1.6) * U, lean = a * 0.9 * U + (rng() - 0.5) * 0.4 * U;
      g.beginPath();
      g.moveTo(bx - 0.32 * U, y);
      g.quadraticCurveTo(bx + lean * 0.2, y - h * 0.55, bx + lean, y - h);
      g.quadraticCurveTo(bx + lean * 0.3 + 0.1 * U, y - h * 0.45, bx + 0.32 * U, y);
      g.closePath();
      g.fill();
    }
  }
  // flowers
  const flowerCols = [C.blush, C.cream, C.star];
  const flowers = Math.max(5, Math.round(W / (14 * U)));
  for (let i = 0; i < flowers; i++) {
    const x = rng() * W;
    if (Math.abs(x - dx) < dw * 2.2) continue;
    const y = nearHillY(x) + 2 * U + rng() * 8 * U;
    g.strokeStyle = C.hillNear; g.lineWidth = 0.35 * U;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 2.2 * U); g.stroke();
    g.fillStyle = flowerCols[i % flowerCols.length];
    for (let p = 0; p < 5; p++) { const a = p / 5 * TAU; ellipse(g, x + Math.cos(a) * 0.8 * U, y + Math.sin(a) * 0.8 * U, 0.65 * U, 0.65 * U); g.fill(); }
    g.fillStyle = C.cheese; ellipse(g, x, y, 0.5 * U, 0.5 * U); g.fill();
  }

  world.homeX = dx + 14 * U;
  world.homeY = nearHillY(world.homeX) - 0.35 * mouseS();
}

function seedSky() {
  const rng = mulberry32(5);
  skyStars = [];
  const n = Math.round(clamp(W * H / (110 * U * U), 40, 90));
  for (let i = 0; i < n; i++) {
    skyStars.push({ x: rng() * W, y: rng() * H * 0.62, r: (0.18 + rng() * 0.32) * U, ph: rng() * TAU, sp: 0.8 + rng() * 2.2, big: rng() < 0.12 });
  }
  fireflies = [];
  const nf = reduceMotion ? 4 : 8;
  for (let i = 0; i < nf; i++) {
    fireflies.push({ x: rnd(0, W), y: rnd(H * 0.55, H * 0.95), ph: rnd(0, TAU), sp: rnd(0.6, 1.4), a: rnd(0, TAU) });
  }
}

/* ---------- drawing: Pip ---------- */
function drawMouse(g, m) {
  const s = m.s, run = m.run || 0, ph = m.phase || 0, t = m.t || 0, munch = m.munch || 0;
  g.save();
  g.translate(m.x, m.y);
  g.rotate(m.tilt || 0);
  const sq = m.sq || 0;
  g.scale((m.face || 1) * (1 + sq), 1 - sq);
  g.translate(0, -Math.abs(Math.sin(ph)) * s * 0.14 * run + Math.sin(t * 38) * s * 0.03 * munch);
  g.lineCap = 'round';
  g.lineJoin = 'round';
  const outline = rgba(C.ink, 0.22);

  // tail
  const sway = Math.sin(t * 2.6) * 0.5 + Math.sin(ph * 0.5) * 0.4 * run;
  g.strokeStyle = C.tail; g.lineWidth = s * 0.15;
  g.beginPath(); g.moveTo(-s * 0.85, s * 0.28);
  g.bezierCurveTo(-s * 1.65, s * 0.55, -s * 2.05, s * (-0.1 + sway * 0.25), -s * 1.7, s * (-0.7 + sway * 0.3));
  g.quadraticCurveTo(-s * 1.5, s * (-1.0 + sway * 0.3), -s * 1.28, s * (-0.82 + sway * 0.25));
  g.stroke();

  // back foot
  const stepA = Math.sin(ph) * run, stepB = Math.sin(ph + Math.PI) * run;
  g.fillStyle = C.ear;
  ellipse(g, -s * 0.38 + stepB * s * 0.22, s * 0.74 - Math.max(0, stepB) * s * 0.14, s * 0.27, s * 0.14); g.fill();

  // body
  g.lineWidth = s * 0.05; g.strokeStyle = outline;
  g.fillStyle = C.fur; ellipse(g, 0, 0, s * 1.05, s * 0.8); g.fill(); g.stroke();
  g.fillStyle = C.furLight; ellipse(g, s * 0.22, s * 0.28, s * 0.6, s * 0.4); g.fill();

  // back ear
  g.fillStyle = C.fur; ellipse(g, s * 0.32, -s * 0.98, s * 0.4, s * 0.42); g.fill(); g.stroke();
  g.fillStyle = C.ear; ellipse(g, s * 0.34, -s * 0.96, s * 0.25, s * 0.27); g.fill();

  // head and snout
  g.fillStyle = C.fur;
  ellipse(g, s * 0.82, -s * 0.36, s * 0.62, s * 0.58); g.fill(); g.stroke();
  ellipse(g, s * 1.32, -s * 0.24, s * 0.44, s * 0.3, -0.08); g.fill();
  ellipse(g, s * 0.82, -s * 0.36, s * 0.58, s * 0.54); g.fill();

  // front ear
  g.fillStyle = C.fur; ellipse(g, s * 0.98, -s * 1.08, s * 0.44, s * 0.46); g.fill(); g.stroke();
  g.fillStyle = C.ear; ellipse(g, s * 1.0, -s * 1.06, s * 0.28, s * 0.3); g.fill();

  // cheek
  const baseAlpha = g.globalAlpha;
  g.fillStyle = C.blush; g.globalAlpha = baseAlpha * 0.55;
  ellipse(g, s * 0.96, -s * 0.1, s * (0.17 + munch * 0.07), s * (0.11 + munch * 0.05)); g.fill();
  g.globalAlpha = baseAlpha;

  // eye
  if (m.blink > 0) {
    g.strokeStyle = C.ink; g.lineWidth = s * 0.06;
    g.beginPath(); g.arc(s * 1.08, -s * 0.55, s * 0.1, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
  } else {
    g.fillStyle = C.ink; ellipse(g, s * 1.08, -s * 0.52, s * 0.115, s * 0.14); g.fill();
    g.fillStyle = C.cream; ellipse(g, s * 1.12, -s * 0.57, s * 0.045, s * 0.045); g.fill();
  }

  // nose and mouth
  g.fillStyle = C.blush; ellipse(g, s * 1.73, -s * 0.3, s * 0.11, s * 0.095); g.fill();
  g.strokeStyle = C.ink; g.lineWidth = s * 0.045;
  if (munch > 0 && Math.sin(t * 38) > 0) {
    g.fillStyle = C.ink; ellipse(g, s * 1.44, -s * 0.1, s * 0.08, s * 0.06); g.fill();
  } else {
    g.beginPath(); g.arc(s * 1.44, -s * 0.18, s * 0.1, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();
  }

  // whiskers
  g.globalAlpha = baseAlpha * 0.55; g.lineWidth = s * 0.03;
  g.beginPath();
  g.moveTo(s * 1.55, -s * 0.26); g.lineTo(s * 2.1, -s * 0.44);
  g.moveTo(s * 1.56, -s * 0.21); g.lineTo(s * 2.16, -s * 0.21);
  g.moveTo(s * 1.55, -s * 0.16); g.lineTo(s * 2.08, -s * 0.0);
  g.stroke();
  g.globalAlpha = baseAlpha;

  // paw and front foot
  g.fillStyle = C.ear;
  ellipse(g, s * 0.64, s * 0.46, s * 0.15, s * 0.12); g.fill();
  ellipse(g, s * 0.42 + stepA * s * 0.22, s * 0.76 - Math.max(0, stepA) * s * 0.14, s * 0.28, s * 0.14); g.fill();
  if (m.hat) drawHat(g, m.hat, s, t);
  g.restore();
}

/* ---------- hats (Pip gets a new one each trip through the front door) ---------- */
const HATS = ['party', 'top', 'crown', 'beanie', 'chef', 'propeller', 'flower', 'cowboy'];
const SILLY_HATS = ['duck', 'cheese', 'tower', 'giant', 'pancakes'];
function pickHat() {
  const silly = Math.random() < 0.25;
  const list = (silly ? SILLY_HATS : HATS).filter(h => h !== mouse.hat);
  mouse.hat = pick(list);
  mouse.hatSilly = silly;
  return silly;
}
function drawHat(g, hat, s, t) {
  g.save();
  g.translate(s * 0.66, -s * 0.92);
  g.rotate(0.14);
  hatShape(g, hat, s * 1.2, t);
  g.restore();
}
// Each hat is drawn with its brim at (0, 0), growing upward.
function hatShape(g, hat, s, t) {
  g.save();
  g.lineJoin = 'round';
  g.lineCap = 'round';
  g.strokeStyle = rgba(C.ink, 0.3);
  g.lineWidth = s * 0.04;
  switch (hat) {
    case 'party':
      g.beginPath(); g.moveTo(-s * 0.36, 0); g.lineTo(0, -s * 0.95); g.lineTo(s * 0.36, 0); g.closePath();
      g.fillStyle = C.shirtSky; g.fill(); g.stroke();
      g.save(); g.clip();
      g.fillStyle = C.cheese;
      for (let i = 0; i < 3; i++) {
        g.beginPath();
        g.moveTo(-s, -s * (0.12 + i * 0.3)); g.lineTo(s, -s * (0.32 + i * 0.3));
        g.lineTo(s, -s * (0.42 + i * 0.3)); g.lineTo(-s, -s * (0.22 + i * 0.3));
        g.closePath(); g.fill();
      }
      g.restore();
      g.fillStyle = C.blush; ellipse(g, 0, -s * 0.97, s * 0.12, s * 0.12); g.fill();
      break;
    case 'top':
      g.fillStyle = C.ink; rrect(g, -s * 0.3, -s * 0.7, s * 0.6, s * 0.7, s * 0.05); g.fill();
      g.fillStyle = C.blush; g.fillRect(-s * 0.3, -s * 0.2, s * 0.6, s * 0.12);
      g.fillStyle = C.ink; ellipse(g, 0, 0, s * 0.5, s * 0.1); g.fill();
      break;
    case 'crown':
      g.beginPath();
      g.moveTo(-s * 0.36, 0); g.lineTo(-s * 0.4, -s * 0.45); g.lineTo(-s * 0.18, -s * 0.22); g.lineTo(0, -s * 0.55);
      g.lineTo(s * 0.18, -s * 0.22); g.lineTo(s * 0.4, -s * 0.45); g.lineTo(s * 0.36, 0); g.closePath();
      g.fillStyle = C.cheese; g.fill(); g.strokeStyle = C.cheeseDeep; g.stroke();
      g.fillStyle = C.blush; ellipse(g, 0, -s * 0.12, s * 0.07, s * 0.07); g.fill();
      g.fillStyle = C.shirtSky; ellipse(g, -s * 0.22, -s * 0.1, s * 0.05, s * 0.05); g.fill(); ellipse(g, s * 0.22, -s * 0.1, s * 0.05, s * 0.05); g.fill();
      g.fillStyle = C.cream;
      for (const [x, y] of [[-0.4, -0.45], [0, -0.55], [0.4, -0.45]]) { ellipse(g, x * s, y * s, s * 0.05, s * 0.05); g.fill(); }
      break;
    case 'beanie':
      g.fillStyle = C.shirtPink; g.beginPath(); g.ellipse(0, 0, s * 0.42, s * 0.48, 0, Math.PI, TAU); g.closePath(); g.fill();
      g.fillStyle = C.shirtLilac; rrect(g, -s * 0.44, -s * 0.12, s * 0.88, s * 0.16, s * 0.06); g.fill();
      g.fillStyle = C.cream; ellipse(g, 0, -s * 0.5, s * 0.13, s * 0.13); g.fill();
      break;
    case 'chef':
      g.fillStyle = C.ghost;
      for (const [x, y, rr] of [[-0.2, -0.45, 0.22], [0.2, -0.45, 0.22], [0, -0.62, 0.25]]) { ellipse(g, x * s, y * s, rr * s, rr * s); g.fill(); g.stroke(); }
      rrect(g, -s * 0.3, -s * 0.38, s * 0.6, s * 0.4, s * 0.04); g.fill(); g.stroke();
      break;
    case 'propeller': {
      g.fillStyle = C.shirtOrange; g.beginPath(); g.ellipse(0, 0, s * 0.4, s * 0.42, 0, Math.PI, TAU); g.closePath(); g.fill();
      g.fillStyle = C.shirtTeal; g.beginPath(); g.moveTo(0, 0); g.ellipse(0, 0, s * 0.4, s * 0.42, 0, Math.PI * 1.33, Math.PI * 1.66); g.closePath(); g.fill();
      g.strokeStyle = C.ink; g.lineWidth = s * 0.05; g.beginPath(); g.moveTo(0, -s * 0.42); g.lineTo(0, -s * 0.58); g.stroke();
      const spin = Math.cos(t * 22);
      g.fillStyle = C.blush; ellipse(g, -s * 0.22 * spin, -s * 0.6, s * 0.22 * Math.abs(spin) + s * 0.02, s * 0.06); g.fill();
      g.fillStyle = C.cheese; ellipse(g, s * 0.22 * spin, -s * 0.6, s * 0.22 * Math.abs(spin) + s * 0.02, s * 0.06); g.fill();
      break;
    }
    case 'flower':
      g.strokeStyle = C.grass; g.lineWidth = s * 0.07;
      g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-s * 0.1, -s * 0.35, s * 0.05, -s * 0.6); g.stroke();
      g.fillStyle = C.grass; ellipse(g, -s * 0.12, -s * 0.28, s * 0.12, s * 0.06, -0.6); g.fill();
      g.fillStyle = C.blush;
      for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + t; ellipse(g, s * 0.05 + Math.cos(a) * s * 0.17, -s * 0.66 + Math.sin(a) * s * 0.17, s * 0.12, s * 0.12); g.fill(); }
      g.fillStyle = C.cheese; ellipse(g, s * 0.05, -s * 0.66, s * 0.1, s * 0.1); g.fill();
      break;
    case 'cowboy':
      g.fillStyle = C.wood;
      g.beginPath(); g.moveTo(-s * 0.26, -s * 0.05); g.lineTo(-s * 0.3, -s * 0.5); g.quadraticCurveTo(0, -s * 0.36, s * 0.3, -s * 0.5); g.lineTo(s * 0.26, -s * 0.05); g.closePath(); g.fill();
      g.fillStyle = C.woodDark; g.fillRect(-s * 0.27, -s * 0.17, s * 0.54, s * 0.08);
      g.fillStyle = C.wood;
      g.beginPath(); g.moveTo(-s * 0.64, -s * 0.16); g.quadraticCurveTo(0, s * 0.14, s * 0.64, -s * 0.16); g.quadraticCurveTo(0, s * 0.02, -s * 0.64, -s * 0.16); g.fill();
      break;
    // ---- the very silly ones ----
    case 'duck':
      g.translate(0, Math.sin(t * 5) * s * 0.04);
      g.fillStyle = C.star;
      ellipse(g, 0, -s * 0.25, s * 0.42, s * 0.26); g.fill(); g.stroke();
      ellipse(g, s * 0.25, -s * 0.62, s * 0.22, s * 0.22); g.fill(); g.stroke();
      g.fillStyle = C.shirtOrange; ellipse(g, s * 0.5, -s * 0.58, s * 0.13, s * 0.06); g.fill();
      g.fillStyle = C.ink; ellipse(g, s * 0.31, -s * 0.67, s * 0.04, s * 0.05); g.fill();
      g.fillStyle = C.cheeseDeep; ellipse(g, -s * 0.12, -s * 0.28, s * 0.18, s * 0.1, -0.3); g.fill();
      break;
    case 'cheese':
      g.fillStyle = C.cheese;
      g.beginPath(); g.moveTo(-s * 0.45, 0); g.lineTo(s * 0.45, 0); g.lineTo(s * 0.45, -s * 0.2); g.lineTo(-s * 0.45, -s * 0.72); g.closePath(); g.fill();
      g.strokeStyle = C.cheeseDeep; g.stroke();
      g.fillStyle = C.cheeseDeep;
      for (const [x, y, rr] of [[-0.25, -0.25, 0.09], [0.12, -0.11, 0.06], [-0.33, -0.5, 0.05]]) { ellipse(g, x * s, y * s, rr * s, rr * s); g.fill(); }
      break;
    case 'tower':
      // a beanie, a top hat and a party hat stacked up, wobbling
      hatShape(g, 'beanie', s, t);
      g.translate(0, -s * 0.42); g.rotate(Math.sin(t * 4) * 0.1);
      hatShape(g, 'top', s * 0.85, t);
      g.translate(0, -s * 0.62); g.rotate(Math.sin(t * 4 + 1) * 0.14);
      hatShape(g, 'party', s * 0.75, t);
      break;
    case 'giant':
      // a ridiculously tall top hat
      g.rotate(Math.sin(t * 3) * 0.08);
      g.fillStyle = C.ink; rrect(g, -s * 0.28, -s * 2.1, s * 0.56, s * 2.1, s * 0.05); g.fill();
      g.fillStyle = C.blush; g.fillRect(-s * 0.28, -s * 0.24, s * 0.56, s * 0.12);
      g.fillStyle = C.star; starPath(g, 0, -s * 1.3, s * 0.16, s * 0.07, -Math.PI / 2); g.fill();
      g.fillStyle = C.ink; ellipse(g, 0, 0, s * 0.5, s * 0.1); g.fill();
      break;
    case 'pancakes':
      for (let i = 0; i < 4; i++) {
        const y = -s * (0.08 + i * 0.13), x = Math.sin(i * 2.1) * s * 0.05;
        g.fillStyle = C.wood; ellipse(g, x, y + s * 0.03, s * 0.46, s * 0.1); g.fill();
        g.fillStyle = C.cheeseDeep; ellipse(g, x, y, s * 0.46, s * 0.1); g.fill();
      }
      g.fillStyle = C.woodDark;
      ellipse(g, 0, -s * 0.48, s * 0.3, s * 0.07); g.fill();
      rrect(g, s * 0.2, -s * 0.5, s * 0.07, s * 0.3, s * 0.035); g.fill();
      g.fillStyle = C.cheeseLight; rrect(g, -s * 0.1, -s * 0.6, s * 0.2, s * 0.1, s * 0.02); g.fill();
      break;
  }
  g.restore();
}

/* ---------- drawing: ghosts ---------- */
function drawGhost(g, gh, t, look) {
  const r = gh.r || gh.rU * U;
  const happy = gh.state === 'away';
  const bob = Math.sin(t * 2 + gh.bob) * r * 0.08;
  const shake = gh.state === 'scared' ? Math.sin(gh.t * 70) * r * 0.05 : 0;
  g.save();
  g.translate(gh.x + shake, gh.y + bob);
  g.rotate(gh.rot);
  const br = 1 + Math.sin(t * 2.4 + gh.bob) * 0.03;
  g.scale(gh.scale * (2 - br), gh.scale * br);
  g.globalAlpha = gh.alpha;

  // soft glow
  const glow = g.createRadialGradient(0, r * 0.2, r * 0.2, 0, r * 0.2, r * 1.9);
  glow.addColorStop(0, rgba(gh.tint, 0.38));
  glow.addColorStop(1, rgba(gh.tint, 0));
  g.fillStyle = glow;
  g.fillRect(-r * 2, -r * 1.8, r * 4, r * 4);

  // little arms (behind the body)
  const wave = happy ? Math.sin(t * 16) * 0.7 : Math.sin(t * 3 + gh.arm) * 0.35;
  g.fillStyle = gh.tint;
  g.save(); g.translate(-r * 0.9, r * 0.32); g.rotate(-0.5 - wave); ellipse(g, -r * 0.12, 0, r * 0.3, r * 0.16); g.fill(); g.restore();
  g.save(); g.translate(r * 0.9, r * 0.32); g.rotate(0.5 + wave); ellipse(g, r * 0.12, 0, r * 0.3, r * 0.16); g.fill(); g.restore();

  // body with a wiggly hem
  const base = r;
  g.beginPath();
  g.moveTo(-r, 0);
  g.arc(0, 0, r, Math.PI, 0);
  g.lineTo(r, base);
  const n = 4, seg = 2 * r / n;
  for (let i = 0; i < n; i++) {
    const x0 = r - seg * i, x1 = x0 - seg, cx = (x0 + x1) / 2;
    const w = Math.sin(t * 5 + i * 1.4 + gh.bob) * r * 0.07;
    g.quadraticCurveTo(cx, base + r * 0.34 + w, x1, base + (i < n - 1 ? w * 0.4 : 0));
  }
  g.closePath();
  const body = g.createLinearGradient(0, -r, 0, base + r * 0.35);
  body.addColorStop(0, C.ghost);
  body.addColorStop(1, gh.tint);
  g.fillStyle = body;
  g.fill();

  // face
  let lx = 0, ly = 0;
  if (look) {
    lx = clamp((look.x - gh.x) / (r * 5), -1, 1) * r * 0.07;
    ly = clamp((look.y - gh.y) / (r * 5), -1, 1) * r * 0.06;
  }
  const ex = r * 0.34, ey = -r * 0.08;
  const mode = gh.state === 'scared' ? 'surprised' : happy ? 'giggle' : (gh.nervous > 0.45 ? 'oo' : 'smile');

  g.fillStyle = C.blush; g.globalAlpha = gh.alpha * 0.7;
  ellipse(g, -r * 0.58 + lx * 0.5, r * 0.16, r * 0.13, r * 0.08); g.fill();
  ellipse(g, r * 0.58 + lx * 0.5, r * 0.16, r * 0.13, r * 0.08); g.fill();
  g.globalAlpha = gh.alpha;

  g.strokeStyle = C.ink; g.lineCap = 'round'; g.lineWidth = r * 0.065;
  if (mode === 'giggle') {
    for (const sx of [-1, 1]) { g.beginPath(); g.arc(sx * ex, ey + r * 0.05, r * 0.1, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
    g.fillStyle = C.ink;
    g.beginPath(); g.arc(0, r * 0.12, r * 0.18, 0, Math.PI); g.closePath(); g.fill();
    g.fillStyle = C.blush; ellipse(g, 0, r * 0.23, r * 0.08, r * 0.045); g.fill();
  } else {
    const big = mode === 'surprised' ? 1.3 : mode === 'oo' ? 1.12 : 1;
    const blink = gh.blink > 0 && mode === 'smile';
    for (const sx of [-1, 1]) {
      const x = sx * ex + lx, y = ey + ly;
      if (blink) {
        g.beginPath(); g.moveTo(x - r * 0.1, y); g.lineTo(x + r * 0.1, y); g.stroke();
      } else {
        g.fillStyle = C.ink; ellipse(g, x, y, r * 0.115 * big, r * 0.16 * big); g.fill();
        g.fillStyle = C.ghost; ellipse(g, x + r * 0.035, y - r * 0.06, r * 0.04 * big, r * 0.045 * big); g.fill();
      }
    }
    g.fillStyle = C.ink;
    if (mode === 'smile') { g.beginPath(); g.arc(lx * 0.6, r * 0.1, r * 0.14, 0.18 * Math.PI, 0.82 * Math.PI); g.stroke(); }
    else if (mode === 'oo') { ellipse(g, lx * 0.6, r * 0.22, r * 0.07, r * 0.085); g.fill(); }
    else { ellipse(g, lx * 0.6, r * 0.25, r * 0.11, r * 0.15); g.fill(); }
  }
  g.restore();
}

/* ---------- drawing: zombies (the sleepy, friendly kind) ---------- */
function drawZombie(g, z, t, look) {
  const r = z.r || z.rU * U;
  const happy = z.state === 'away';
  const scared = z.state === 'scared';
  const face = z.faceK === undefined ? 1 : z.faceK;
  const moving = happy ? 1 : clamp(Math.hypot(z.vx || 0, z.vy || 0) / (6 * U), 0, 1);
  const walk = z.walk || 0;
  const hop = happy ? Math.abs(Math.sin(z.t * 13)) * r * 0.22 : Math.abs(Math.sin(walk)) * r * 0.05 * moving;
  const shake = scared ? Math.sin(z.t * 70) * r * 0.05 : 0;

  g.save();
  // ground shadow
  g.fillStyle = C.ink;
  g.globalAlpha = z.alpha * 0.18;
  ellipse(g, z.x, z.y + r * 1.36 * z.scale, r * 0.6 * z.scale, r * 0.11 * z.scale); g.fill();
  g.globalAlpha = z.alpha;

  g.translate(z.x + shake, z.y - hop);
  g.rotate(z.rot);
  g.scale(z.scale * face, z.scale);
  g.lineCap = 'round';
  g.lineJoin = 'round';
  const outline = rgba(C.ink, 0.25);

  // legs and shoes (back leg first)
  const swing = Math.sin(walk) * r * 0.13 * moving;
  for (const [lx, sw] of [[-0.28, -swing], [0.04, swing]]) {
    g.fillStyle = C.zombiePants;
    rrect(g, lx * r + sw, 0.7 * r, 0.24 * r, 0.55 * r, 0.08 * r); g.fill();
    g.fillStyle = C.ink;
    ellipse(g, (lx + 0.16) * r + sw, 1.27 * r, 0.18 * r, 0.09 * r); g.fill();
  }

  // arms reach forward (classic zombie), shoot up when surprised, flail when running off
  const armFront = scared ? -1.3 : happy ? -1.0 + Math.sin(t * 16) * 0.5 : 0.08 + Math.sin(t * 3 + z.arm) * 0.07;
  const armBack = scared ? -1.15 : happy ? -1.1 + Math.sin(t * 16 + 2) * 0.5 : Math.sin(t * 3 + z.arm + 1.3) * 0.07;
  const L = 0.78 * r;
  const arm = (sx, sy, a, col) => {
    const ex = sx + Math.cos(a) * L, ey = sy + Math.sin(a) * L;
    g.strokeStyle = col; g.lineWidth = 0.2 * r;
    g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex, ey); g.stroke();
    g.fillStyle = col; ellipse(g, ex, ey, 0.13 * r, 0.13 * r); g.fill();
  };
  arm(0.05 * r, 0.2 * r, armBack, C.zombieShade);

  // shirt with a raggedy hem and a patch
  g.fillStyle = z.tint;
  g.beginPath();
  g.moveTo(-0.42 * r, 0.82 * r);
  g.lineTo(-0.46 * r, 0.28 * r);
  g.quadraticCurveTo(-0.44 * r, 0, -0.12 * r, 0);
  g.lineTo(0.18 * r, 0);
  g.quadraticCurveTo(0.48 * r, 0, 0.46 * r, 0.28 * r);
  g.lineTo(0.42 * r, 0.82 * r);
  for (let i = 1; i <= 8; i++) g.lineTo(0.42 * r - 0.84 * r * i / 8, 0.82 * r + (i % 2 ? 0.1 * r : 0));
  g.closePath();
  g.fill();
  g.strokeStyle = outline; g.lineWidth = 0.04 * r; g.stroke();
  g.fillStyle = rgba(C.cream, 0.35);
  rrect(g, -0.3 * r, 0.38 * r, 0.2 * r, 0.18 * r, 0.03 * r); g.fill();

  // front arm with a sleeve
  arm(0.12 * r, 0.3 * r, armFront, C.zombieSkin);
  g.strokeStyle = z.tint; g.lineWidth = 0.27 * r;
  g.beginPath(); g.moveTo(0.1 * r, 0.27 * r); g.lineTo(0.1 * r + Math.cos(armFront) * 0.28 * r, 0.27 * r + Math.sin(armFront) * 0.28 * r); g.stroke();

  // big round head, ear, hair tuft, forehead stitches
  const hx = 0.06 * r, hy = -0.5 * r, hr = 0.6 * r;
  g.fillStyle = C.zombieShade; ellipse(g, hx - hr * 0.88, hy + 0.05 * r, 0.13 * r, 0.17 * r); g.fill();
  g.fillStyle = C.zombieSkin; ellipse(g, hx, hy, hr, hr * 0.95); g.fill();
  g.strokeStyle = outline; g.lineWidth = 0.04 * r; g.stroke();
  g.strokeStyle = C.ink; g.lineWidth = 0.05 * r;
  g.beginPath();
  g.moveTo(hx - 0.1 * r, hy - hr * 0.93); g.quadraticCurveTo(hx - 0.2 * r, hy - hr * 1.25, hx - 0.32 * r, hy - hr * 1.2);
  g.moveTo(hx, hy - hr * 0.95); g.quadraticCurveTo(hx + 0.02 * r, hy - hr * 1.32, hx + 0.12 * r, hy - hr * 1.38);
  g.moveTo(hx + 0.1 * r, hy - hr * 0.93); g.quadraticCurveTo(hx + 0.25 * r, hy - hr * 1.2, hx + 0.35 * r, hy - hr * 1.12);
  g.stroke();
  g.strokeStyle = rgba(C.ink, 0.45); g.lineWidth = 0.03 * r;
  g.beginPath();
  g.moveTo(hx - 0.34 * r, hy - 0.35 * r); g.lineTo(hx - 0.06 * r, hy - 0.42 * r);
  for (let i = 0; i < 3; i++) {
    const sx = hx - 0.29 * r + i * 0.09 * r, sy = hy - 0.365 * r - i * 0.022 * r;
    g.moveTo(sx, sy - 0.05 * r); g.lineTo(sx, sy + 0.05 * r);
  }
  g.stroke();

  // face: one eye a bit bigger than the other, sleepy lids, rosy cheeks
  let lx = 0, ly = 0;
  if (look) {
    lx = clamp((look.x - z.x) / (r * 5), -1, 1) * r * 0.05 * (face < 0 ? -1 : 1);
    ly = clamp((look.y - z.y) / (r * 5), -1, 1) * r * 0.04;
  }
  const mode = scared ? 'surprised' : happy ? 'giggle' : (z.nervous > 0.45 ? 'oo' : 'smile');
  const eyes = [[hx - 0.04 * r, hy - 0.06 * r, 1], [hx + 0.3 * r, hy - 0.08 * r, 0.82]];
  g.fillStyle = C.blush; g.globalAlpha = z.alpha * 0.55;
  ellipse(g, hx - 0.22 * r, hy + 0.2 * r, 0.11 * r, 0.065 * r); g.fill();
  ellipse(g, hx + 0.46 * r, hy + 0.18 * r, 0.09 * r, 0.06 * r); g.fill();
  g.globalAlpha = z.alpha;
  g.strokeStyle = C.ink; g.lineWidth = 0.06 * r;
  const mx = hx + 0.13 * r, my = hy + 0.2 * r;
  if (mode === 'giggle') {

    g.fillStyle = C.ink; g.beginPath(); g.arc(mx, my + 0.02 * r, 0.16 * r, 0, Math.PI); g.closePath(); g.fill();
    g.fillStyle = C.blush; ellipse(g, mx, my + 0.12 * r, 0.07 * r, 0.04 * r); g.fill();
  } else {
    const big = mode === 'surprised' ? 1.25 : mode === 'oo' ? 1.1 : 1;
    for (const [ex, ey, sz] of eyes) {
      const er = 0.13 * r * sz * big;
      g.fillStyle = C.ghost; ellipse(g, ex, ey, er, er * 1.1); g.fill();
      g.fillStyle = C.ink; ellipse(g, ex + lx, ey + ly + er * 0.1, er * 0.55, er * 0.6); g.fill();
      if (mode === 'smile') {
        g.fillStyle = C.zombieShade;
        g.beginPath();
        if (z.blink > 0) g.ellipse(ex, ey, er * 1.08, er * 1.18, 0, 0, TAU);
        else g.ellipse(ex, ey, er * 1.08, er * 1.18, 0, Math.PI, TAU);
        g.closePath(); g.fill();
      }
    }
    g.fillStyle = C.ink;
    if (mode === 'smile') {
      g.beginPath(); g.arc(mx, my, 0.14 * r, 0.05 * Math.PI, 0.95 * Math.PI); g.closePath(); g.fill();
      g.fillStyle = C.ghost; g.fillRect(mx + 0.03 * r, my, 0.06 * r, 0.06 * r);
    } else if (mode === 'oo') {
      ellipse(g, mx, my + 0.04 * r, 0.06 * r, 0.075 * r); g.fill();
    } else {
      ellipse(g, mx, my + 0.07 * r, 0.1 * r, 0.13 * r); g.fill();
    }
  }
  g.restore();
}
/* ---------- drawing: aliens in tiny flying saucers ---------- */
function drawAlien(g, a, t, look) {
  const r = a.r || a.rU * U;
  const happy = a.state === 'away', scared = a.state === 'scared';
  const bob = Math.sin(t * 3 + a.bob) * r * 0.1;
  const shake = scared ? Math.sin(a.t * 70) * r * 0.06 : 0;
  g.save();
  g.translate(a.x + shake, a.y + bob);
  g.rotate(a.rot);
  g.scale(a.scale, a.scale);
  g.globalAlpha = a.alpha;
  g.lineCap = 'round';
  g.lineJoin = 'round';

  // soft beam of light under the saucer
  if (!happy) {
    const beam = g.createLinearGradient(0, r * 0.3, 0, r * 1.7);
    beam.addColorStop(0, rgba(a.tint, 0.32));
    beam.addColorStop(1, rgba(a.tint, 0));
    g.fillStyle = beam;
    g.beginPath(); g.moveTo(-r * 0.4, r * 0.3); g.lineTo(r * 0.4, r * 0.3); g.lineTo(r * 0.8, r * 1.7); g.lineTo(-r * 0.8, r * 1.7); g.closePath(); g.fill();
  }
  // saucer underside
  g.fillStyle = C.saucerDark;
  ellipse(g, 0, r * 0.18, r * 0.66, r * 0.2); g.fill();

  // the alien: antennae, round head, 1-3 eyes, rosy cheeks, waving hands
  const hy = -r * 0.42;
  const wob = Math.sin(t * 6 + a.arm) * r * 0.05;
  g.strokeStyle = a.tint; g.lineWidth = r * 0.07;
  for (const sx of [-1, 1]) {
    const tx = sx * r * 0.21 + wob * sx, ty = hy - r * 0.48;
    g.beginPath(); g.moveTo(sx * r * 0.12, hy - r * 0.28); g.quadraticCurveTo(sx * r * 0.14, hy - r * 0.42, tx, ty); g.stroke();
    g.fillStyle = PARTY_COLORS[(Math.floor(t * 3 + a.arm) + (sx > 0 ? 2 : 0)) % PARTY_COLORS.length];
    ellipse(g, tx, ty, r * 0.075, r * 0.075); g.fill();
  }
  g.fillStyle = a.tint;
  ellipse(g, 0, hy, r * 0.36, r * 0.34); g.fill();
  const handUp = happy ? -0.2 + Math.sin(t * 18) * 0.12 : scared ? -0.28 : Math.sin(t * 4 + a.arm) * 0.04;
  ellipse(g, -r * 0.44, -r * 0.2 + handUp * r, r * 0.09, r * 0.09); g.fill();
  ellipse(g, r * 0.44, -r * 0.2 - handUp * r * (happy ? -1 : 1), r * 0.09, r * 0.09); g.fill();

  let lx = 0, ly = 0;
  if (look) {
    lx = clamp((look.x - a.x) / (r * 5), -1, 1) * r * 0.035;
    ly = clamp((look.y - a.y) / (r * 5), -1, 1) * r * 0.03;
  }
  const mode = scared ? 'surprised' : happy ? 'giggle' : (a.nervous > 0.45 ? 'oo' : 'smile');
  const eyeSets = {
    1: [[0, hy - r * 0.05, 0.15]],
    2: [[-r * 0.13, hy - r * 0.05, 0.1], [r * 0.13, hy - r * 0.05, 0.1]],
    3: [[-r * 0.17, hy - r * 0.02, 0.08], [0, hy - r * 0.11, 0.085], [r * 0.17, hy - r * 0.02, 0.08]]
  };
  const eyes = eyeSets[a.eyes || 2];
  g.fillStyle = C.blush; g.globalAlpha = a.alpha * 0.6;
  ellipse(g, -r * 0.22, hy + r * 0.12, r * 0.07, r * 0.045); g.fill();
  ellipse(g, r * 0.22, hy + r * 0.12, r * 0.07, r * 0.045); g.fill();
  g.globalAlpha = a.alpha;
  g.strokeStyle = C.ink; g.lineWidth = r * 0.05;
  const my = hy + r * 0.17;
  if (mode === 'giggle') {
    for (const [ex, ey, er] of eyes) { g.beginPath(); g.arc(ex, ey + r * 0.02, er * r * 0.8, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
    g.fillStyle = C.ink; g.beginPath(); g.arc(0, my - r * 0.02, r * 0.09, 0, Math.PI); g.closePath(); g.fill();
  } else {
    const big = mode === 'surprised' ? 1.25 : mode === 'oo' ? 1.1 : 1;
    for (const [ex, ey, er0] of eyes) {
      const er = er0 * r * big;
      if (a.blink > 0 && mode === 'smile') {
        g.beginPath(); g.moveTo(ex - er, ey); g.lineTo(ex + er, ey); g.stroke();
        continue;
      }
      g.fillStyle = C.ghost; ellipse(g, ex, ey, er, er * 1.1); g.fill();
      g.fillStyle = C.ink; ellipse(g, ex + lx, ey + ly, er * 0.55, er * 0.6); g.fill();
      g.fillStyle = C.ghost; ellipse(g, ex + lx + er * 0.2, ey + ly - er * 0.25, er * 0.18, er * 0.18); g.fill();
    }
    g.fillStyle = C.ink;
    if (mode === 'smile') { g.beginPath(); g.arc(0, my - r * 0.06, r * 0.08, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); }
    else if (mode === 'oo') { ellipse(g, 0, my, r * 0.045, r * 0.055); g.fill(); }
    else { ellipse(g, 0, my + r * 0.01, r * 0.07, r * 0.085); g.fill(); }
  }

  // saucer disc
  const disc = g.createLinearGradient(0, -r * 0.2, 0, r * 0.3);
  disc.addColorStop(0, C.ghost);
  disc.addColorStop(1, C.saucer);
  g.fillStyle = disc;
  ellipse(g, 0, r * 0.05, r, r * 0.27); g.fill();
  g.strokeStyle = C.saucerDark; g.lineWidth = r * 0.04;
  g.stroke();
  // glass dome
  g.beginPath();
  g.ellipse(0, -r * 0.05, r * 0.66, r * 0.95, 0, Math.PI, TAU);
  g.closePath();
  g.fillStyle = GLASS; g.fill();
  g.strokeStyle = rgba(C.cream, 0.5); g.lineWidth = r * 0.03; g.stroke();
  g.strokeStyle = rgba(C.cream, 0.7); g.lineWidth = r * 0.05;
  g.beginPath(); g.ellipse(0, -r * 0.05, r * 0.52, r * 0.8, 0, Math.PI * 1.15, Math.PI * 1.38); g.stroke();
  // twinkly rim lights
  for (let i = 0; i < 5; i++) {
    const x = (i - 2) * r * 0.36;
    g.fillStyle = PARTY_COLORS[(i + Math.floor(t * 5 + a.arm)) % PARTY_COLORS.length];
    ellipse(g, x, r * 0.13 - Math.abs(i - 2) * r * 0.04, r * 0.065, r * 0.065); g.fill();
  }
  g.restore();
}

/* ---------- drawing: baby dinosaurs (they hatch from eggs) ---------- */
function drawDino(g, z, t, look) {
  const r = z.r || z.rU * U;
  g.save();
  if (z.state === 'appear' && !z.hatched) {
    // a speckled egg that wobbles more and more, then cracks
    const k = Math.min(1, z.t / 0.7);
    g.fillStyle = C.ink; g.globalAlpha = 0.18;
    ellipse(g, z.x, z.y + r * 1.36, r * 0.45, r * 0.09); g.fill();
    g.globalAlpha = 1;
    g.translate(z.x, z.y + r * 1.35);
    g.rotate(Math.sin(z.t * 32) * 0.18 * k);
    g.fillStyle = C.egg;
    ellipse(g, 0, -r * 0.5, r * 0.4, r * 0.5); g.fill();
    g.strokeStyle = rgba(C.ink, 0.25); g.lineWidth = r * 0.04; g.stroke();
    g.fillStyle = z.accent;
    for (const [x, y, rr] of [[-0.15, -0.7, 0.07], [0.14, -0.45, 0.09], [-0.1, -0.25, 0.06], [0.18, -0.8, 0.05]]) { ellipse(g, x * r, y * r, rr * r, rr * r); g.fill(); }
    if (k > 0.45) {
      g.strokeStyle = C.ink; g.lineWidth = r * 0.04;
      g.beginPath(); g.moveTo(-r * 0.36, -r * 0.55);
      for (let i = 1; i <= 6; i++) g.lineTo(-r * 0.36 + i * r * 0.12, -r * 0.55 + (i % 2 ? -r * 0.1 : r * 0.04));
      g.stroke();
    }
    g.restore();
    return;
  }
  const happy = z.state === 'away', scared = z.state === 'scared';
  const face = z.faceK === undefined ? 1 : z.faceK;
  const moving = happy ? 1 : clamp(Math.hypot(z.vx || 0, z.vy || 0) / (6 * U), 0, 1);
  const walk = z.walk || 0;
  const hop = happy ? Math.abs(Math.sin(z.t * 11)) * r * 0.25 : Math.abs(Math.sin(walk)) * r * 0.04 * moving;
  const shake = scared ? Math.sin(z.t * 70) * r * 0.05 : 0;

  g.fillStyle = C.ink; g.globalAlpha = z.alpha * 0.18;
  ellipse(g, z.x, z.y + r * 1.36 * z.scale, r * 0.75 * z.scale, r * 0.12 * z.scale); g.fill();
  g.globalAlpha = z.alpha;
  g.translate(z.x + shake, z.y - hop);
  g.rotate(z.rot);
  g.scale(z.scale * face, z.scale);
  g.lineCap = 'round';
  g.lineJoin = 'round';
  const outline = rgba(C.ink, 0.22);
  const body = z.tint;

  // swishy tail
  const sway = Math.sin(t * 3 + z.bob) * r * 0.1 + (happy ? Math.sin(t * 20) * r * 0.1 : 0);
  g.fillStyle = body;
  g.beginPath();
  g.moveTo(-r * 0.4, r * 0.2);
  g.quadraticCurveTo(-r * 1.0, r * 0.2, -r * 1.38, r * 0.5 + sway);
  g.quadraticCurveTo(-r * 0.95, r * 0.66, -r * 0.3, r * 0.82);
  g.closePath(); g.fill();
  g.strokeStyle = outline; g.lineWidth = r * 0.04; g.stroke();

  // chunky legs with little toes (back leg a shade darker)
  const swing = Math.sin(walk) * r * 0.12 * moving;
  for (const [lx, sw, shade] of [[-0.3, -swing, true], [0.1, swing, false]]) {
    g.fillStyle = body;
    rrect(g, lx * r + sw, r * 0.72, r * 0.28, r * 0.58, r * 0.1); g.fill();
    if (shade) { g.fillStyle = rgba(C.ink, 0.18); rrect(g, lx * r + sw, r * 0.72, r * 0.28, r * 0.58, r * 0.1); g.fill(); }
    g.fillStyle = C.cream;
    for (let i = 0; i < 3; i++) { ellipse(g, lx * r + sw + r * (0.06 + i * 0.08), r * 1.28, r * 0.04, r * 0.032); g.fill(); }
  }

  // rounded plates along the back
  g.fillStyle = z.accent;
  for (const deg of [196, 222, 248, 274]) {
    const th = deg * Math.PI / 180;
    const bx = Math.cos(th) * r * 0.58, by = r * 0.45 + Math.sin(th) * r * 0.46;
    const nx = Math.cos(th), ny = Math.sin(th), tx = -ny, ty = nx, h = r * 0.32, w = r * 0.13;
    g.beginPath();
    g.moveTo(bx - tx * w, by - ty * w);
    g.quadraticCurveTo(bx + nx * h * 1.2, by + ny * h * 1.2, bx + tx * w, by + ty * w);
    g.closePath(); g.fill();
  }
  // body and tummy
  g.fillStyle = body; ellipse(g, 0, r * 0.45, r * 0.62, r * 0.5); g.fill();
  g.strokeStyle = outline; g.stroke();
  g.fillStyle = C.dinoBelly; ellipse(g, r * 0.16, r * 0.56, r * 0.38, r * 0.3); g.fill();

  // neck, head and snout, with a little crest
  g.fillStyle = z.accent;
  g.beginPath(); g.moveTo(r * 0.3, -r * 0.62); g.quadraticCurveTo(r * 0.36, -r * 0.95, r * 0.5, -r * 0.7); g.closePath(); g.fill();
  g.fillStyle = body;
  ellipse(g, r * 0.36, r * 0.05, r * 0.26, r * 0.36); g.fill();
  ellipse(g, r * 0.5, -r * 0.36, r * 0.42, r * 0.36); g.fill(); g.stroke();
  ellipse(g, r * 0.82, -r * 0.26, r * 0.32, r * 0.23); g.fill(); g.stroke();
  ellipse(g, r * 0.5, -r * 0.36, r * 0.39, r * 0.33); g.fill();
  ellipse(g, r * 0.36, r * 0.05, r * 0.23, r * 0.3); g.fill();

  // tiny arm
  g.save(); g.translate(r * 0.46, r * 0.32); g.rotate(happy ? -1 + Math.sin(t * 16) * 0.5 : 0.5 + Math.sin(t * 3 + z.arm) * 0.15);
  ellipse(g, r * 0.1, 0, r * 0.14, r * 0.07); g.fill(); g.stroke();
  g.restore();

  // face
  let lx = 0, ly = 0;
  if (look) {
    lx = clamp((look.x - z.x) / (r * 5), -1, 1) * r * 0.04 * (face < 0 ? -1 : 1);
    ly = clamp((look.y - z.y) / (r * 5), -1, 1) * r * 0.035;
  }
  const mode = scared ? 'surprised' : happy ? 'giggle' : (z.nervous > 0.45 ? 'oo' : 'smile');
  g.fillStyle = C.blush; g.globalAlpha = z.alpha * 0.55;
  ellipse(g, r * 0.62, -r * 0.2, r * 0.09, r * 0.055); g.fill();
  g.globalAlpha = z.alpha;
  g.fillStyle = C.ink; ellipse(g, r * 1.01, -r * 0.36, r * 0.025, r * 0.02); g.fill();
  const ex = r * 0.5, ey = -r * 0.46;
  g.strokeStyle = C.ink; g.lineWidth = r * 0.055;
  if (mode === 'giggle') {
    g.beginPath(); g.arc(ex, ey + r * 0.03, r * 0.1, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
    g.fillStyle = C.ink; g.beginPath(); g.arc(r * 0.86, -r * 0.2, r * 0.13, 0, Math.PI); g.closePath(); g.fill();
    g.fillStyle = C.blush; ellipse(g, r * 0.86, -r * 0.12, r * 0.06, r * 0.035); g.fill();
  } else {
    const big = mode === 'surprised' ? 1.3 : mode === 'oo' ? 1.12 : 1;
    const er = r * 0.13 * big;
    if (z.blink > 0 && mode === 'smile') {
      g.beginPath(); g.moveTo(ex - er, ey); g.lineTo(ex + er, ey); g.stroke();
    } else {
      g.fillStyle = C.ghost; ellipse(g, ex, ey, er, er * 1.1); g.fill();
      g.fillStyle = C.ink; ellipse(g, ex + lx + er * 0.15, ey + ly, er * 0.55, er * 0.62); g.fill();
      g.fillStyle = C.ghost; ellipse(g, ex + lx + er * 0.3, ey + ly - er * 0.25, er * 0.18, er * 0.18); g.fill();
    }
    g.fillStyle = C.ink;
    if (mode === 'smile') {
      g.lineWidth = r * 0.045;
      g.beginPath(); g.moveTo(r * 0.66, -r * 0.18); g.quadraticCurveTo(r * 0.88, -r * 0.06, r * 1.06, -r * 0.2); g.stroke();
      g.fillStyle = C.ghost;
      for (const tx of [0.8, 0.93]) { g.beginPath(); g.moveTo(r * (tx - 0.035), -r * 0.135); g.lineTo(r * (tx + 0.035), -r * 0.14); g.lineTo(r * tx, -r * 0.08); g.closePath(); g.fill(); }
    } else if (mode === 'oo') {
      ellipse(g, r * 0.92, -r * 0.16, r * 0.05, r * 0.06); g.fill();
    } else {
      ellipse(g, r * 0.9, -r * 0.15, r * 0.09, r * 0.11); g.fill();
    }
  }
  g.restore();
}

function drawEnemy(g, gh, t, look) {
  if (gh.kind === 'zombie') drawZombie(g, gh, t, look);
  else if (gh.kind === 'alien') drawAlien(g, gh, t, look);
  else if (gh.kind === 'dino') drawDino(g, gh, t, look);
  else drawGhost(g, gh, t, look);
}

/* ---------- drawing: the moon (sleepy, or wide awake and silly) ---------- */
function drawMoon(g, t) {
  const mr = world.moonR, mx = world.moonX, my = world.moonY;
  const a = moon.awake, wob = moon.wobble;
  const hr = mr * (3.2 + a * 0.6);
  const halo = g.createRadialGradient(mx, my, mr * 0.8, mx, my, hr);
  halo.addColorStop(0, rgba(C.moon, 0.33 + a * 0.15));
  halo.addColorStop(1, rgba(C.moon, 0));
  g.fillStyle = halo;
  g.fillRect(mx - hr, my - hr, hr * 2, hr * 2);
  g.save();
  g.translate(mx, my);
  g.rotate(Math.sin(t * 18) * 0.07 * wob);
  const sc = 1 + Math.sin(t * 24) * 0.05 * wob;
  g.scale(sc, 2 - sc);
  g.fillStyle = C.moon; ellipse(g, 0, 0, mr, mr); g.fill();
  g.fillStyle = rgba(C.cheeseLight, 0.55);
  ellipse(g, mr * 0.42, -mr * 0.45, mr * 0.16, mr * 0.14); g.fill();
  ellipse(g, -mr * 0.55, mr * 0.5, mr * 0.11, mr * 0.1); g.fill();
  g.fillStyle = rgba(C.blush, 0.5);

    moon.variant = v;

/* ---------- Pip's front door: in he goes, out he comes in a new hat ---------- */
function drawDoor(g) {
  const dx = world.doorX, top = world.doorTop, bot = world.doorBot, dw = world.doorW;
  const open = door.open;
  g.fillStyle = C.ink;
  archPath(g, dx, top, dw, bot); g.fill();
  if (open > 0.01) {
    const glow = g.createRadialGradient(dx, bot - dw * 0.3, dw * 0.1, dx, bot - dw * 0.3, dw);
    glow.addColorStop(0, rgba(C.cheese, 0.75 * open));
    glow.addColorStop(1, rgba(C.cheese, 0.1 * open));
    g.fillStyle = glow;
    archPath(g, dx, top, dw, bot); g.fill();
  }
  // the door swings open on its left hinge
  const hinge = dx - dw / 2;
  g.save();
  g.translate(hinge, 0);
  g.scale(1 - open * 0.82, 1);
  g.translate(-hinge, 0);
  g.fillStyle = C.wood; archPath(g, dx, top, dw, bot); g.fill();
  g.strokeStyle = rgba(C.woodDark, 0.7); g.lineWidth = 0.35 * U;
  g.beginPath();
  for (const off of [-0.25, 0, 0.25]) { g.moveTo(dx + off * dw, top + (off === 0 ? 0.3 * U : 1.4 * U)); g.lineTo(dx + off * dw, bot); }
  g.stroke();
  g.fillStyle = C.cheese; ellipse(g, dx + dw * 0.3, top + dw * 0.75, 0.7 * U, 0.7 * U); g.fill();
  if (open > 0) { g.fillStyle = rgba(C.ink, 0.35 * open); archPath(g, dx, top, dw, bot); g.fill(); }
  g.restore();
}
function updateDoor(dt) {
  const s = mouseS();
  const cx = world.doorX, cy = world.doorBot - s * 0.75;   // where Pip stands in the doorway
  door.t += dt;
  switch (door.phase) {
    case 'idle': {
      door.open = Math.max(0, door.open - dt * 3);
      if (state.mode === 'title') return;
      const d = Math.hypot(mouse.x - cx, mouse.y - cy);
      if (!door.armed) { if (d > 12 * U) door.armed = true; return; }
      // open as Pip runs up to the door (he was sent there), or if he wanders right onto it
      const headingIn = Math.hypot(mouse.tx - cx, mouse.ty - cy) < 9 * U && d < world.doorW / 2 + s * 1.6;
      if ((headingIn || d < 7 * U) && mouse.hopT >= 1) {
        door.waitX = Math.max(mouse.x, cx + world.doorW / 2 + s * 1.1);
        door.phase = 'opening'; door.t = 0; door.busy = true; door.armed = false;
        mouse.lock = null; mouse.lockCheese = false;
        Sound.creak(0.5);
      }
      break;
    }
    case 'opening':
      // wait beside the door, looking at it, while it creaks open
      door.open = Math.min(1, door.t / 0.4);
      mouse.tx = door.waitX; mouse.ty = cy;
      mouse.face = -1;
      if (door.t >= 0.5) { door.phase = 'entering'; door.t = 0; }
      break;
    case 'entering': {
      const k = Math.min(1, door.t / 0.35);
      mouse.inK = 1 - k;
      mouse.tx = cx; mouse.ty = cy;
      mouse.x += (cx - mouse.x) * Math.min(1, 10 * dt);
      mouse.y += (cy - mouse.y) * Math.min(1, 10 * dt);
      if (k >= 1) { door.phase = 'inside'; door.t = 0; Sound.rummage(); }
      break;
    }
    case 'inside':
      mouse.inK = 0;
      mouse.x = mouse.tx = cx; mouse.y = mouse.ty = cy; mouse.vx = mouse.vy = 0;
      if (door.t >= 0.6) {
        door.phase = 'exiting'; door.t = 0;
        mouse.face = mouse.faceK = 1;
        Sound.tada(pickHat());
      }
      break;
    case 'exiting': {
      const k = Math.min(1, door.t / 0.3);
      mouse.inK = k;
      if (door.t > 0.15) { mouse.tx = cx + 13 * U; mouse.ty = nearHillY(cx + 13 * U) - s * 0.35; }
      if (k >= 1 && door.t > 0.35) {

        Sound.creak(0.3);

}
function resetDoor() {

}

/* ---------- drawing: the reward cheese ---------- */

  poly([[-1.1, -0.25], [-0.7, -0.6], [1.25, -0.1], [0.9, 0.2]]); g.fillStyle = C.cheeseLight; g.fill(); g.stroke();
  poly([[-1.1, -0.25], [0.9, 0.2], [0.9, 0.6], [-1.1, 0.6]]); g.fillStyle = C.cheese; g.fill(); g.stroke();
  g.fillStyle = C.cheeseDeep;
  for (const [x, y, rx, ry] of [[-0.62, 0.28, 0.15, 0.13], [0.02, 0.4, 0.1, 0.09], [0.5, 0.43, 0.07, 0.065], [-0.28, 0.1, 0.075, 0.065], [-0.85, 0.47, 0.06, 0.05]]) {

    ellipse(g, x * r, y * r, rx * r, ry * r); g.fill();
  }

}

/* ---------- particles ---------- */

}

function updateParticles(dt) {
  for (const p of particles) {
    p.life += dt;
    if (p.drag) { const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; }
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    if (p.type === 'confetti') p.x += Math.sin(p.life * 3 + p.rot) * 8 * U * dt;
  }
  particles = particles.filter(p => p.life < p.max);
}

function drawParticles(g) {
  for (const p of particles) {
    const k = p.life / p.max;
    g.save();
    switch (p.type) {
      case 'puff':
        g.globalAlpha = (1 - k) * 0.85;
        g.fillStyle = p.color;
        ellipse(g, p.x, p.y, p.size * (0.6 + k * 1.2), p.size * (0.6 + k * 1.2)); g.fill();
        break;
      case 'spark':
      case 'trail': {
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = (1 - k) * (p.type === 'trail' ? 0.8 : 1);
        g.fillStyle = p.color;
        const R = p.size * (1 - k * 0.5);
        starPath(g, p.x, p.y, R, R * 0.45, p.rot); g.fill();
        break;
      }
      case 'dot':
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = 1 - k;
        g.fillStyle = p.color;
        ellipse(g, p.x, p.y, p.size, p.size); g.fill();
        break;
      case 'confetti':
        g.globalAlpha = Math.min(1, (1 - k) * 3);
        g.fillStyle = p.color;
        g.translate(p.x, p.y); g.rotate(p.rot);
        g.fillRect(-p.size / 2, -p.size * 0.3 * Math.abs(Math.cos(p.life * 6)), p.size, p.size * 0.6 * Math.abs(Math.cos(p.life * 6)) + 0.5);
        break;
      case 'crumb':
        g.globalAlpha = 1 - k * k;
        g.fillStyle = p.color;
        g.translate(p.x, p.y); g.rotate(p.rot);
        g.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        break;
      case 'ring':
        g.globalAlpha = (1 - k) * 0.7;
        g.strokeStyle = p.color; g.lineWidth = 0.55 * U;
        ellipse(g, p.x, p.y, p.size * (0.3 + k), p.size * (0.3 + k)); g.stroke();
        break;
    }
    g.restore();
  }
}

/* ---------- timers that pause with the game ---------- */

function runTimers(dt) {
  for (let i = timers.length - 1; i >= 0; i--) {
    const tm = timers[i];
    tm.t -= dt;

  }

/* ---------- ghosts ---------- */

// level 2 is +14%, level 3 +27%, level 5 +48%, level 10 +82%. Even the fastest ghost is
// still well under Pip's top speed, so every ghost can always be caught.

// Where each kind may roam: ghosts float in the sky, zombies walk along the hills.

function spawnGhost(opts) {

function catchGhost(gh) {

/* ---------- stars ---------- */

/* ---------- Pip ---------- */
function mouseBounds() {

    y0: inset.top + 12 * U, y1: H - 7 * U - inset.bottom

}

/* ---------- hints for little players who get stuck ---------- */

/* ---------- HUD: the five star slots ---------- */

/* ---------- ambient sky ---------- */
