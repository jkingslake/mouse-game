  const t = state.time;
  g.fillStyle = C.cream;
  for (const s of skyStars) {
    g.globalAlpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    if (s.big) {
      starPath(g, s.x, s.y, s.r * 2.6, s.r * 0.7, -Math.PI / 2); g.fill();
    } else {
      ellipse(g, s.x, s.y, s.r, s.r); g.fill();
    }
  }
  g.globalAlpha = 1;
  for (const f of fireflies) {
    const a = 0.5 + 0.5 * Math.sin(t * 2.2 * f.sp + f.ph);
    const glow = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, 2.6 * U);
    glow.addColorStop(0, rgba(C.firefly, 0.55 * a)); glow.addColorStop(1, rgba(C.firefly, 0));
    g.fillStyle = glow;
    g.fillRect(f.x - 2.6 * U, f.y - 2.6 * U, 5.2 * U, 5.2 * U);
    g.globalAlpha = 0.4 + 0.6 * a;
    g.fillStyle = C.firefly;
    ellipse(g, f.x, f.y, 0.45 * U, 0.45 * U); g.fill();
    g.globalAlpha = 1;
  }
}
function updateFireflies(dt) {
  for (const f of fireflies) {
    f.a += rnd(-1, 1) * dt * 1.5;
    f.x += Math.cos(f.a) * 4 * U * f.sp * dt;
    f.y += Math.sin(f.a) * 3 * U * f.sp * dt;
    if (f.y < H * 0.5) f.a = turnToward(f.a, Math.PI / 2, dt * 2);
    if (f.y > H * 0.97) f.a = turnToward(f.a, -Math.PI / 2, dt * 2);
    if (f.x < -3 * U) f.x = W + 3 * U;
    if (f.x > W + 3 * U) f.x = -3 * U;
  }
}

/* ---------- input ---------- */
function setTargetFromPoint(x, y, isTap) {
  let best = null, bd = Infinity;
  for (const gh of ghosts) {
    if (!catchable(gh)) continue;
    const d = Math.hypot(x - gh.x, y - gh.y);
    if (d < gh.rU * U * 1.8 && d < bd) { best = gh; bd = d; }
  }
  mouse.lock = best;
  mouse.lockCheese = false;
  if (!best && party && party.cheese && party.cheese.landed && !party.cheese.gone) {
    const ch = party.cheese;
    if (Math.hypot(x - ch.x, y - ch.y) < ch.rU * U * 1.7) mouse.lockCheese = true;
  }
  mouse.tx = x;
  mouse.ty = y;
  if (isTap) ripple(x, y);
}

canvas.addEventListener('pointerdown', e => {
  Sound.unlock();
  if (state.mode === 'title') { startGame(); return; }
  if (door.busy) return;
  pointer.id = e.pointerId;
  pointer.down = true;
  state.idle = 0;
  setTargetFromPoint(e.clientX, e.clientY, true);
  if (state.time - state.lastSqueak > 0.35) { Sound.squeak(); state.lastSqueak = state.time; }
});
canvas.addEventListener('pointermove', e => {
  if (!pointer.down || e.pointerId !== pointer.id || state.mode === 'title' || door.busy) return;
  state.idle = 0;
  setTargetFromPoint(e.clientX, e.clientY, false);
});
const releasePointer = e => {
  Sound.unlock();
  if (e.pointerId === pointer.id) pointer.down = false;
};
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);

for (const type of ['touchend', 'pointerup', 'click', 'keydown']) {
  document.addEventListener(type, () => Sound.unlock(), { capture: true, passive: true });
}
titleEl.addEventListener('pointerup', () => { Sound.unlock(); startGame(); });

/* ---------- ghosts or zombies? (chosen on the start screen) ---------- */
const kindSelect = document.getElementById('kind');
const chooserEl = document.getElementById('chooser');
const restEl = document.querySelector('.title__rest');
const kindWordEl = document.getElementById('kind-word');
// taps on the chooser must not start the game
for (const type of ['pointerdown', 'pointerup', 'click']) chooserEl.addEventListener(type, e => e.stopPropagation());
kindSelect.addEventListener('change', () => setKind(kindSelect.value, true));

const KINDS = {
  ghost: { plural: 'Ghosts', scene: 'friendly ghosts floating in the sky' },
  zombie: { plural: 'Zombies', scene: 'friendly zombies wandering the hills' },
  alien: { plural: 'Aliens', scene: 'lots of friendly aliens zooming about in tiny flying saucers' },
  dino: { plural: 'Dinosaurs', scene: 'friendly baby dinosaurs stomping about the hills' }
};
function setKind(kind, fromUser) {
  state.kind = KINDS[kind] ? kind : 'ghost';
  kindSelect.value = state.kind;
  const plural = KINDS[state.kind].plural;
  restEl.textContent = 'and the ' + plural;
  kindWordEl.textContent = plural.toLowerCase();
  canvas.setAttribute('aria-label', 'Pip the mouse in a moonlit meadow, with ' + KINDS[state.kind].scene);
  try { localStorage.setItem('pip-kind', state.kind); } catch (e) { /* remembering is optional */ }
  if (state.mode === 'title') {
    for (const gh of ghosts) puff(gh.x, gh.y + gh.rU * U * 0.2, C.cream, gh.rU * U * 0.8);
    resetTitleCast();
    if (fromUser) { Sound.unlock(); Sound.poof(); Sound.arrive(state.kind); }
  }
}
titleEl.addEventListener('click', () => { Sound.unlock(); startGame(); });

// stop iPad zoom, scroll bounce, long-press menus and double-tap zoom
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());

let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { wakeLock = null; }
}
function tryFullscreen() {
  const standalone = navigator.standalone || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  if (standalone || document.fullscreenElement || document.webkitFullscreenElement) return;
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!fn) return;
  try {
    const p = fn.call(el);
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* optional */ }
}

/* ---------- level badge and "Level 2!" banner ---------- */
const levelEl = document.getElementById('level');
const levelNumEl = document.getElementById('level-num');
const bannerEl = document.getElementById('level-banner');
let bannerTimer = 0;
function showLevel(announce) {
  const n = state.round + 1;
  levelNumEl.textContent = String(n);
  levelEl.hidden = false;
  levelEl.classList.remove('bump'); void levelEl.offsetWidth; levelEl.classList.add('bump');
  if (announce) {
    bannerEl.textContent = 'Level ' + n;
    bannerEl.hidden = false;
    bannerEl.classList.remove('show'); void bannerEl.offsetWidth; bannerEl.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => { bannerEl.hidden = true; }, 2000);
  }
}

/* ---------- home button: press and hold to go back to the start screen ---------- */
// Holding (instead of tapping) keeps small fingers from leaving the game by accident.
const homeBtn = document.getElementById('home');
const homeRing = homeBtn.querySelector('circle');
const homeTip = document.getElementById('home-tip');
const HOLD_SECONDS = 1;
const RING_LEN = 145;
let homeHold = null, tipTimer = 0;
// After a hold sends Pip home, the finger lifting off lands on the start screen; ignore that one tap.
let suppressStart = false;
function setRing(p) { homeRing.style.strokeDashoffset = String(RING_LEN * (1 - p)); }
function cancelHold() {
  if (homeHold && (performance.now() - homeHold.start) / 1000 < HOLD_SECONDS * 0.9) {
    homeTip.hidden = false;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => { homeTip.hidden = true; }, 1600);
  }
  homeHold = null;
  setRing(0);
}
homeBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  homeHold = { start: performance.now() };
  try { homeBtn.setPointerCapture(e.pointerId); } catch (err) { /* not needed everywhere */ }
});
homeBtn.addEventListener('pointerup', cancelHold);
homeBtn.addEventListener('pointercancel', cancelHold);
// keyboard users (Enter or Space make a click with no pointer) go straight home
homeBtn.addEventListener('click', e => { if (e.detail === 0) goHome(); });
// timed in real seconds (not game time) so the hold is the same length on any iPad
function updateHomeHold() {
  if (!homeHold) return;
  const p = Math.min(1, (performance.now() - homeHold.start) / 1000 / HOLD_SECONDS);
  setRing(p);
  if (p >= 1) { homeHold = null; setRing(0); suppressStart = true; goHome(); }
}
window.addEventListener('pointerup', () => { if (suppressStart) setTimeout(() => { suppressStart = false; }, 450); });
window.addEventListener('pointercancel', () => { if (suppressStart) setTimeout(() => { suppressStart = false; }, 450); });

function goHome() {
  if (state.mode === 'title') return;
  state.mode = 'title';
  state.round = 0; state.caught = 0; state.filled = 0; state.idle = 0;
  party = null; flyers = []; timers = []; particles = [];
  slots.forEach(sl => { sl.filled = false; sl.pop = 0; });
  mouse.lock = null; mouse.lockCheese = false; mouse.munch = 0;
  pointer.down = false;
  resetDoor();
  moon.timer = 0; moon.armed = true;
  resetTitleCast();
  homeBtn.hidden = true; homeTip.hidden = true;
  levelEl.hidden = true; bannerEl.hidden = true;
  titleEl.hidden = false;
  void titleEl.offsetWidth;
  titleEl.classList.remove('is-leaving');
  Sound.whoosh();
}

function startGame() {
  if (state.mode !== 'title' || suppressStart) return;
  state.mode = 'play';
  state.idle = 0;
  state.round = 0;
  state.spawnTimer = 0.4;
  titleEl.classList.add('is-leaving');
  setTimeout(() => { if (state.mode !== 'title') titleEl.hidden = true; }, 500);
  Sound.squeak();
  mouse.hopT = 0;
  homeBtn.hidden = false;
  showLevel(true);
  keepAwake();
  tryFullscreen();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (state.mode !== 'title') keepAwake();
    if (Sound.ctx && Sound.ctx.state !== 'running') Sound.ctx.resume().catch(() => {});
    if (Sound.media && Sound.media.paused) Sound.media.play().catch(() => {});
  } else {
    if (Sound.ctx) Sound.ctx.suspend().catch(() => {});
    if (Sound.media) Sound.media.pause();
  }
});

let resizeQueued = false;
function queueResize() {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; resize(); });
}
window.addEventListener('resize', queueResize);
window.addEventListener('orientationchange', () => { queueResize(); setTimeout(queueResize, 300); });

/* ---------- main loop ---------- */
function update(dt) {
  state.time += dt;
  state.idle += dt;
  runTimers(dt);

  const live = ghosts.filter(gh => gh.state === 'appear' || gh.state === 'float').length;
  if (state.mode === 'title') {
    const free = TITLE_SPOTS[state.kind].find(a => !ghosts.some(g => g.anchor === a && !g.dead));
    if (free) spawnGhost({ silent: true, anchor: free });
  } else if (state.mode === 'play') {
    const crowd = state.kind === 'alien';
    // ghosts and zombies: exactly five per level; aliens: keep the sky busy until five are caught
    const room = crowd ? state.caught < STARS_PER_ROUND : state.caught + live < STARS_PER_ROUND;
    if (live < maxOnScreen(state.round) && room) {
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) { spawnGhost(); state.spawnTimer = crowd ? rnd(0.3, 0.7) : rnd(0.9, 1.8); }
    }
  }

  updateDoor(dt);
  updateMouse(dt);
  updateMoon(dt);
  for (const gh of ghosts) updateGhost(gh, dt);
  ghosts = ghosts.filter(gh => !gh.dead);

  if (state.mode === 'play' && mouse.inK > 0.5) {
    const s = mouseS();
    const headX = mouse.x + Math.sign(mouse.faceK || 1) * s * 1.1, headY = mouse.y - s * 0.35;
    for (const gh of ghosts) {
      if (!catchable(gh)) continue;
      const reach = gh.rU * U * 0.95 + s * 0.6;
      const gy = gh.y + gh.rU * U * 0.15;
      if (Math.hypot(gh.x - mouse.x, gy - mouse.y) < reach || Math.hypot(gh.x - headX, gy - headY) < reach * 0.9) catchGhost(gh);
    }
  }
  if (state.mode === 'party' && party) updateParty(dt);

  // hinted ghosts give a little "wooo" now and then
  const h = hintTarget();
  if (h && h.ghost) {
    state.hintWoo -= dt;
    if (state.hintWoo <= 0) { Sound.arrive(h.ghost.kind); state.hintWoo = 5; }
  } else {
    state.hintWoo = 1.5;
  }

  updateHomeHold();
  updateFlyers(dt);
  updateParticles(dt);
  updateFireflies(dt);
  for (const sl of slots) sl.pop = Math.max(0, sl.pop - dt * 2.5);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky(ctx);
  drawMoon(ctx, state.time);
  drawDoor(ctx);
  if (party && party.cheese) drawCheese(ctx, party.cheese, state.time);
  for (const gh of ghosts.slice().sort((a, b) => a.y - b.y)) drawEnemy(ctx, gh, state.time, mouse);

  const mv = mouseView();
  if (mouse.inK > 0.01) {
    ctx.save();
    ctx.globalAlpha = 0.18 * mouse.inK * mouse.inK;
    ctx.fillStyle = C.ink;
    const lift = mouse.y - mv.y;
    ellipse(ctx, mouse.x, mouse.y + mv.s * 0.92, mv.s * 1.1 * (1 - lift / (20 * U)), mv.s * 0.2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = mouse.inK;
    drawMouse(ctx, mv);
    ctx.restore();
  }

  drawParticles(ctx);
  drawHUD(ctx);
  const h = hintTarget();
  if (h) drawHint(ctx, h);
}

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

resize();
let savedKind = 'ghost';
try { savedKind = localStorage.getItem('pip-kind') || 'ghost'; } catch (e) { /* first visit or storage blocked */ }
setKind(savedKind, false);
render();
requestAnimationFrame(frame);
</script>
</body>
</html>
